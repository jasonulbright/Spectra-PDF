# Where the suite lives, and — as importantly — where it does not.
#
# Without `testpaths`, a bare `pytest` at the repo root walks the VENDORED
# runtimes: `resources/python/Lib/site-packages` and the copy of it under
# `src-tauri/target/*/python`. numpy ships its own `conftest.py` that imports
# `hypothesis`, so collection died before a single test ran — and the workaround
# (always type `pytest tests`) is exactly the kind of "run it this one special
# way" that the standing rule about running gates BARE exists to prevent.
[pytest]
testpaths = tests
# Retained, gitignored investigation files and directories are not shipped
# regression tests. File globs exclude scratch files; norecursedirs also excludes
# scratch directories such as tests/probe.local/.
addopts = --ignore-glob=*.local.*
norecursedirs = resources src-tauri/target node_modules .venv dist e2e-tests *.local *.local.*
