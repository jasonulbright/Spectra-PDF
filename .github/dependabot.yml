version: 2

# Dependabot keeps the three dependency graphs current. CI already runs
# `npm audit --production --audit-level=high` and `cargo audit` on every push,
# which catches known-vulnerable versions at build time; these updates are the
# other half -- they arrive as PRs rather than waiting for the next build.
#
# Grouped deliberately: a solo maintainer does not want one PR per package.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The 47 @tesseract.js-data/* language packages move together or not at
      # all -- the OCR staging script fails the build if an offered language is
      # missing its data, so a partial bump is never wanted.
      tesseract-language-data:
        patterns:
          - "@tesseract.js-data/*"
      dev-tooling:
        dependency-type: development
    ignore:
      # TypeScript is PINNED at 6.x on purpose. `typescript-eslint@8.65.0` --
      # the newest stable -- peer-requires `typescript >=4.8.4 <6.1.0`, and no
      # stable release supports TS 7 yet. Merging a 7.x bump makes `npm ci`
      # fail with ERESOLVE, which took CI red for 14 consecutive runs on
      # 2026-07-25. Dependabot re-proposed the identical bump within hours of
      # the revert, so this ignore is what stops the loop.
      # UNBLOCK CONDITION: when a stable typescript-eslint widens that peer
      # range to admit 7.x, delete this entry and bump both together.
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: npm
    directory: /e2e-tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      wdio:
        patterns:
          - "@wdio/*"
          - "webdriverio"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The PYTHON engine dependencies -- the ones that actually parse untrusted
  # files (pikepdf/qpdf, pdfminer.six, Pillow, lxml, cryptography) and ship
  # inside the installer. Easy to forget because they are not npm or cargo, and
  # they are the highest-value manifest in the repo to keep current.
  #
  # NOTE: there is deliberately no `directory: /` pip entry. The root
  # `requirements.txt` was DELETED (2026-07-25) -- nothing referenced it, and
  # it listed only pikepdf + pdfminer.six, so a contributor who followed it got
  # an environment where `test_engine.py` fails to COLLECT (the signatures
  # handler imports pyHanko at module load). The venv recipe in the punchlist's
  # dev notes is the one true dev-environment flow.
  #
  # `scripts/python-requirements.{in,txt}` are the shipped engine's pins and
  # its GENERATED hash-pinned lockfile. Two caveats when a PR appears here:
  #   1. Dependabot's pip fetcher expects conventional requirements filenames,
  #      so it may not discover these at all -- `pip-audit` in CI is the
  #      deterministic guarantee, not this entry.
  #   2. The lockfile is generated by `scripts/lock-python-deps.ps1` with
  #      --require-hashes. Do NOT merge a bump of the .txt directly: change
  #      the .in and REGENERATE, or the hash discipline silently rots.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
