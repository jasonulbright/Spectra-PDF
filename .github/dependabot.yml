version: 2

# Dependabot keeps the three dependency graphs current. CI already runs
# `npm audit --production --audit-level=high` and `cargo audit` on every push,
# which catches known-vulnerable versions at build time; these updates are the
# other half -- they arrive as PRs rather than waiting for the next build.
#
# Grouped deliberately: a solo maintainer does not want one PR per package.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The 47 @tesseract.js-data/* language packages move together or not at
      # all -- the OCR staging script fails the build if an offered language is
      # missing its data, so a partial bump is never wanted.
      tesseract-language-data:
        patterns:
          - "@tesseract.js-data/*"
      dev-tooling:
        dependency-type: development
      # Catch-all LAST: a dependency joins the first group whose rules it
      # matches, so the two specific groups above still win. Without this,
      # every ungrouped production dep (react, radix, pdfjs-dist...) arrives as
      # its OWN PR -- which is how one week produced 13 of them.
      runtime:
        patterns: ['*']
    ignore:
      # TypeScript is PINNED at 6.x on purpose. `typescript-eslint@8.65.0` --
      # the newest stable -- peer-requires `typescript >=4.8.4 <6.1.0`, and no
      # stable release supports TS 7 yet. Merging a 7.x bump makes `npm ci`
      # fail with ERESOLVE, which has taken CI red for 14 consecutive runs;
      # Dependabot re-proposes the identical bump within hours of a revert,
      # so this ignore is what stops the loop.
      # UNBLOCK CONDITION: when a stable typescript-eslint widens that peer
      # range to admit 7.x, delete this entry and bump both together.
      - dependency-name: typescript
        versions: ['>=7']
      # pdfjs-dist is HELD at 6.0.x. On 6.1 `getAttachments()` returns an EMPTY
      # set where 6.0 returned the embedded `.pdfx` manifest, so readManifest()
      # finds nothing and a .pdfx opens as ONE FLAT PDF with its multi-document
      # partition silently lost -- the app's own format. Verified by probing
      # 6.1 directly against tests/fixtures/sample.pdfx. Only three vitest
      # failures signalled it; CI did not run vitest at the time.
      # UNBLOCK: adapt readManifest to whatever 6.1 changed in the
      # embedded-file/name-tree path, then re-pin. See DEFERRALS.
      - dependency-name: pdfjs-dist
        versions: ['>=6.1']

  - package-ecosystem: npm
    directory: /e2e-tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      wdio:
        patterns:
          - "@wdio/*"
          - "webdriverio"
      e2e-tooling:
        patterns: ['*']
    ignore:
      # Same hold as the root project, different reason. Nothing here
      # peer-constrains TypeScript, but this package compiles the WDIO specs
      # that ARE the release gate, and TS 7 against ts-node/tsx/WDIO is
      # unproven. A broken harness costs the gate; TS 7 in test tooling buys
      # nothing. Revisit when the root project moves to 7.x.
      - dependency-name: typescript
        versions: ['>=7']
      # Held in lockstep with the root project: the specs verify `.pdfx`
      # output with their own pdf.js copy, so a version that cannot read the
      # manifest would make the verification lie rather than fail.
      - dependency-name: pdfjs-dist
        versions: ['>=6.1']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      crates:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The PYTHON engine dependencies -- the ones that actually parse untrusted
  # files (pikepdf/qpdf, pdfminer.six, Pillow, lxml, cryptography) and ship
  # inside the installer. Easy to forget because they are not npm or cargo, and
  # they are the highest-value manifest in the repo to keep current.
  #
  # NOTE: there is deliberately no `directory: /` pip entry. The root
  # `requirements.txt` is deleted -- nothing referenced it, and
  # it listed only pikepdf + pdfminer.six, so a contributor who followed it got
  # an environment where `test_engine.py` fails to COLLECT (the signatures
  # handler imports pyHanko at module load). The recorded venv recipe is the
  # one true dev-environment flow.
  #
  # `scripts/python-requirements.{in,txt}` are the shipped engine's pins and
  # its GENERATED hash-pinned lockfile. Two caveats when a PR appears here:
  #   1. Dependabot's pip fetcher expects conventional requirements filenames,
  #      so it may not discover these at all -- `pip-audit` in CI is the
  #      deterministic guarantee, not this entry.
  #   2. The lockfile is generated by `scripts/lock-python-deps.ps1` with
  #      --require-hashes. Do NOT merge a bump of the .txt directly: change
  #      the .in and REGENERATE, or the hash discipline silently rots.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
