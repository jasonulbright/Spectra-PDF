name: Signing smoke

# Runs the release job's signing chain -- the same client-tools install, the
# same federated Azure login, the same scripts/sign-windows.ps1 invocation the
# bundler makes, and the same Assert-AuthenticodeSigned gate the release is
# published against -- over a probe file instead of a build. A broken signing
# chain therefore surfaces in minutes rather than after the ~35-minute release
# build has run.
#
# Fixture invariant: the probe is compiled in the job, so it carries no
# signature and matches no Windows catalog, and it is asserted NotSigned
# before this job signs it. A probe copied from a system binary fails both
# ways: the Authenticode PE hash excludes the signature block, so catalog
# membership survives both the copy and a signature strip, and the gate could
# pass on a signature this run never produced.
on:
  workflow_dispatch:

jobs:
  sign-smoke:
    name: Sign a probe executable
    runs-on: windows-latest
    # Gates the OIDC federated credential: the app registration trusts this
    # repository only through this environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    env:
      # Non-secret signing coordinates, identical to release.yml: the account
      # and profile name what signs; the subject is what the gate requires to
      # have signed. SPECTRAPDF_SIGN is the flag scripts/sign-windows.ps1
      # requires before it signs anything.
      SPECTRAPDF_SIGN: "1"
      SPECTRAPDF_SIGN_ENDPOINT: https://eus.codesigning.azure.net
      SPECTRAPDF_SIGN_ACCOUNT: signalridgelabs
      SPECTRAPDF_SIGN_PROFILE: SRL-Public
      SPECTRAPDF_SIGN_SUBJECT_CN: Jason Ulbright
    steps:
      - uses: actions/checkout@v7

      - name: Install the Artifact Signing client tools
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/install-signing-tools.ps1

      # OIDC: the job's id-token is exchanged for an Azure token through the
      # app registration's federated credential, which is scoped to this
      # environment. No client secret exists to leak or rotate.
      - name: Azure login (federated, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The probe is compiled here rather than copied from a system binary: a
      # compiled PE carries no signature and matches no catalog, and its
      # unsigned state is asserted before signing, so the signature the gate
      # verifies can only be the one this job made. The script is invoked
      # exactly as the bundler's `signCommand` does -- one positional path.
      - name: Sign a probe executable
        shell: pwsh
        run: |
          . ./scripts/windows-signing.ps1
          $probe = Join-Path $env:RUNNER_TEMP "probe"
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          $target = Join-Path $probe "spectrapdf-sign-probe.exe"
          $source = Join-Path $probe "probe.cs"
          Set-Content -LiteralPath $source -Encoding ascii -Value 'class P { static int Main() { return 0; } }'
          $csc = Join-Path $env:SystemRoot "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:$target $source
          if ($LASTEXITCODE -ne 0) { throw "csc.exe failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $target)) { throw "csc.exe produced no probe at $target" }
          $before = Get-AuthenticodeSignature -LiteralPath $target
          Write-Host "probe status before signing: $($before.Status)"
          if ($before.Status -ne "NotSigned") {
            throw "the probe is still signed before this job signs it (status $($before.Status))"
          }
          powershell -ExecutionPolicy Bypass -File scripts/sign-windows.ps1 $target
          $signed = Get-AuthenticodeSignature -LiteralPath $target
          Write-Host "signer:    $($signed.SignerCertificate.Subject)"
          Write-Host "timestamp: $($signed.TimeStamperCertificate.Subject)"
          Write-Host "status:    $($signed.Status)"

      - name: Verify the Authenticode signature on the probe
        shell: pwsh
        run: |
          . ./scripts/windows-signing.ps1
          $target = Join-Path $env:RUNNER_TEMP "probe\spectrapdf-sign-probe.exe"
          Assert-AuthenticodeSigned -Path $target -ExpectedSubjectCommonName $env:SPECTRAPDF_SIGN_SUBJECT_CN
          $signature = Get-AuthenticodeSignature -LiteralPath $target
          Write-Host "signer:    $($signature.SignerCertificate.Subject)"
          Write-Host "timestamp: $($signature.TimeStamperCertificate.Subject)"
          Write-Host "status:    $($signature.Status)"
