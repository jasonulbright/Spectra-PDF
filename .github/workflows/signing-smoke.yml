name: Signing smoke

# Runs the release job's signing chain -- the same client-tools install, the
# same federated Azure login, the same scripts/sign-windows.ps1 invocation the
# bundler makes, and the same Assert-AuthenticodeSigned gate the release is
# published against -- over a probe file instead of a build. A broken signing
# chain therefore surfaces in minutes rather than after the ~35-minute release
# build has run.
#
# Fixture invariant: the probe is compiled in the job, so it carries no
# signature and matches no Windows catalog, and it is asserted NotSigned
# before this job signs it. It is compiled under the app executable's own
# path shape, because the script signs only the three artifacts the release
# publishes and refuses anything else by path. A probe copied from a system
# binary fails both ways: the Authenticode PE hash excludes the signature block, so catalog
# membership survives both the copy and a signature strip, and the gate could
# pass on a signature this run never produced.
on:
  workflow_dispatch:
    inputs:
      delay_minutes:
        description: >-
          Minutes to idle between caching the signing-service token and signing.
          Reproduces a release build's elapsed time so token expiry surfaces here.
        type: number
        default: 0

jobs:
  sign-smoke:
    name: Sign a probe executable
    runs-on: windows-latest
    # Gates the OIDC federated credential: the app registration trusts this
    # repository only through this environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    # Headroom for delay_minutes: reproducing a release build's ~85-minute
    # gap between login and the first signature must not hit the job timeout.
    timeout-minutes: 150
    env:
      # Non-secret signing coordinates, identical to release.yml: the account
      # and profile name what signs; the subject is what the gate requires to
      # have signed. SPECTRAPDF_SIGN is the flag scripts/sign-windows.ps1
      # requires before it signs anything.
      SPECTRAPDF_SIGN: "1"
      SPECTRAPDF_SIGN_ENDPOINT: https://eus.codesigning.azure.net
      SPECTRAPDF_SIGN_ACCOUNT: signalridgelabs
      SPECTRAPDF_SIGN_PROFILE: SRL-Public
      SPECTRAPDF_SIGN_SUBJECT_CN: Jason Ulbright
    steps:
      - uses: actions/checkout@v7

      - name: Install the Artifact Signing client tools
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/install-signing-tools.ps1

      - name: Install NSIS for the packaging smoke
        shell: pwsh
        run: |
          choco install nsis --version=3.11 --yes --no-progress --execution-timeout=300
          if ($LASTEXITCODE -ne 0) { throw "NSIS install failed (exit $LASTEXITCODE)" }

      - name: Exercise portable packaging before signing
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-portable-packaging.ps1

      # OIDC: the job's id-token is exchanged for an Azure token through the
      # app registration's federated credential, which is scoped to this
      # environment. No client secret exists to leak or rotate.
      - name: Azure login (federated, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The federated assertion expires MINUTES after login and the token cached
      # here is valid for at most 60 minutes. The signing dlib asks the CLI for
      # a token in the signing-service scope, which the login itself does not
      # cache, so every signature must happen inside that window measured from
      # this step. This mirrors release.yml, where the same two steps sit
      # immediately before the build.
      - name: Cache a signing-service token
        shell: pwsh
        run: |
          $raw = az account get-access-token --scope https://codesigning.azure.net/.default --output json
          if ($LASTEXITCODE -ne 0) { throw "az account get-access-token failed (exit $LASTEXITCODE)" }
          $token = $raw | ConvertFrom-Json
          Write-Host "signing-service token cached, expires_on: $($token.expires_on)"

      # A smoke that signs seconds after login proves nothing about a release
      # build, which signs an hour later. The delay makes that elapsed time a
      # dial the smoke can reproduce on demand.
      - name: Idle before signing
        shell: pwsh
        run: |
          $requested = "${{ inputs.delay_minutes }}"
          $minutes = if ($requested) { [int]$requested } else { 0 }
          if ($minutes -le 0) { Write-Host "no delay requested"; return }
          Write-Host "idle start: $([DateTimeOffset]::UtcNow.ToString('o')) ($minutes min)"
          Start-Sleep -Seconds ($minutes * 60)
          Write-Host "idle end:   $([DateTimeOffset]::UtcNow.ToString('o'))"

      # The probe is compiled here rather than copied from a system binary: a
      # compiled PE carries no signature and matches no catalog, and its
      # unsigned state is asserted before signing, so the signature the gate
      # verifies can only be the one this job made.
      #
      # The invocation reproduces the bundler's: spawned by Node with piped
      # stdio, from src-tauri, through the relative script path and argument
      # list `signCommand` carries. A step shell has a console and a different
      # environment, and an invocation that only a step shell makes cannot fail
      # the way the bundler's does.
      - name: Sign a probe executable
        shell: pwsh
        run: |
          . ./scripts/windows-signing.ps1
          $probe = Join-Path $env:RUNNER_TEMP "target\release"
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          $target = Join-Path $probe "spectrapdf.exe"
          $source = Join-Path $env:RUNNER_TEMP "probe.cs"
          Set-Content -LiteralPath $source -Encoding ascii -Value 'class P { static int Main() { return 0; } }'
          $csc = Join-Path $env:SystemRoot "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:$target $source
          if ($LASTEXITCODE -ne 0) { throw "csc.exe failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $target)) { throw "csc.exe produced no probe at $target" }
          $before = Get-AuthenticodeSignature -LiteralPath $target
          Write-Host "probe status before signing: $($before.Status)"
          if ($before.Status -ne "NotSigned") {
            throw "the probe is still signed before this job signs it (status $($before.Status))"
          }
          $unsigned = Join-Path $env:RUNNER_TEMP "probe-unsigned.exe"
          Copy-Item -LiteralPath $target -Destination $unsigned -Force
          $spawn = Join-Path $env:RUNNER_TEMP "spawn-sign.js"
          Set-Content -LiteralPath $spawn -Encoding ascii -Value @'
          const cp = require('child_process');
          const args = ['-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            '../scripts/sign-windows.ps1', process.argv[2]];
          const run = cp.spawnSync('powershell', args,
            { cwd: 'src-tauri', stdio: 'pipe', encoding: 'utf8' });
          console.log('spawn status: ' + run.status);
          console.log('spawn error: ' + (run.error ? run.error.message : 'none'));
          console.log('--- stdout ---');
          console.log(run.stdout || '');
          console.log('--- stderr ---');
          console.log(run.stderr || '');
          process.exit(run.status === 0 ? 0 : 1);
          '@
          node $spawn $target
          if ($LASTEXITCODE -ne 0) { throw "the bundler-shaped sign invocation failed (exit $LASTEXITCODE)" }
          $signed = Get-AuthenticodeSignature -LiteralPath $target
          Write-Host "signer:    $($signed.SignerCertificate.Subject)"
          Write-Host "timestamp: $($signed.TimeStamperCertificate.Subject)"
          Write-Host "status:    $($signed.Status)"

      # The bundler hands the sign command every binary it stages, vendored
      # third-party payloads included. A probe under a resources tree proves
      # the script refuses those before it reaches the certificate.
      - name: Refuse a probe outside the signed set
        shell: pwsh
        run: |
          $staged = Join-Path $env:RUNNER_TEMP "resources\tesseract"
          New-Item -ItemType Directory -Force -Path $staged | Out-Null
          $target = Join-Path $staged "probe.dll"
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "probe-unsigned.exe") -Destination $target -Force
          $output = node (Join-Path $env:RUNNER_TEMP "spawn-sign.js") $target
          $code = $LASTEXITCODE
          $output | Write-Host
          if ($code -ne 0) { throw "the sign script failed on a file outside the signed set (exit $code)" }
          if (-not ($output -match "outside the signed set")) {
            throw "the sign script did not refuse '$target'"
          }
          $status = (Get-AuthenticodeSignature -LiteralPath $target).Status
          Write-Host "staged probe status: $status"
          if ($status -ne "NotSigned") { throw "a file outside the signed set was signed (status $status)" }

      - name: Verify the Authenticode signature on the probe
        shell: pwsh
        run: |
          . ./scripts/windows-signing.ps1
          $target = Join-Path $env:RUNNER_TEMP "target\release\spectrapdf.exe"
          Assert-AuthenticodeSigned -Path $target -ExpectedSubjectCommonName $env:SPECTRAPDF_SIGN_SUBJECT_CN
          $signature = Get-AuthenticodeSignature -LiteralPath $target
          Write-Host "signer:    $($signature.SignerCertificate.Subject)"
          Write-Host "timestamp: $($signature.TimeStamperCertificate.Subject)"
          Write-Host "status:    $($signature.Status)"

      # Build a tiny actual NSIS installer with the signed probe, then restore
      # the unsigned probe exactly as Tauri does. The production portable
      # builder must recover the signed bytes from the installer and preserve
      # them through ZIP compression. No Rust build or full application suite.
      - name: Verify signed installer to portable handoff
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-portable-packaging.ps1 -ExpectSigned -SignedProbe "$env:RUNNER_TEMP/target/release/spectrapdf.exe" -UnsignedProbe "$env:RUNNER_TEMP/probe-unsigned.exe"
          if ($LASTEXITCODE -ne 0) { throw "signed portable packaging smoke failed (exit $LASTEXITCODE)" }

      # Include all three signing operations, even when the handoff fails.
      - name: Print the signing logs
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "sign-windows"
          if (-not (Test-Path -LiteralPath $dir)) {
            Write-Host "no sign-windows logs"
            return
          }
          $logs = @(Get-ChildItem -LiteralPath $dir -File | Sort-Object Name)
          if ($logs.Count -eq 0) {
            Write-Host "no sign-windows logs"
            return
          }
          foreach ($log in $logs) {
            Write-Host "===== $($log.Name) ====="
            Get-Content -LiteralPath $log.FullName | Write-Host
          }
