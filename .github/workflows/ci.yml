name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# Every job below only READS the repository — checkout, install, run gates.
# Nothing here publishes, comments, or writes back, so read access to contents
# is the entire requirement. Declared at the workflow level so a job added later
# inherits the restriction instead of silently getting the default write set;
# a job that genuinely needs more should widen it for ITSELF, not here.
permissions:
  contents: read

# Full functional suites run once locally on the release candidate.
# Hosted jobs cover security and a fresh Windows task store.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduler:
    name: Fresh Windows scheduler
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Create resource stubs for Tauri build script
        run: |
          mkdir -p resources/python
          mkdir -p resources/fonts
          mkdir -p resources/libreoffice
          mkdir -p resources/tesseract
          mkdir -p resources/jbig2enc
          mkdir -p resources/dictionaries
          mkdir -p resources/icc
        shell: bash

      - name: Create renderer placeholder for native test compilation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/renderer | Out-Null
          Set-Content dist/renderer/index.html '<html></html>'

      - name: Rust COM scheduler tests (fresh task store)
        run: cd src-tauri && cargo test --lib scheduler -- --ignored

  audit:
    name: Dependency Audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production)
        run: npm audit --production --audit-level=high

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit executable
        id: cargo-audit-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('src-tauri/Cargo.lock', '.github/workflows/ci.yml') }}

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit

      - name: cargo audit
        run: cd src-tauri && cargo audit

      # The third dependency graph. npm audit and cargo audit between them
      # cover the renderer and the Rust backend, but the PYTHON engine ships
      # inside the installer and is the code that parses untrusted PDFs
      # (pikepdf/qpdf, pdfminer.six, Pillow, lxml, cryptography) -- until now
      # nothing checked it. Audited against the hash-pinned lockfile, which is
      # exactly what setup-python-embed.ps1 installs into the shipped runtime.
      - name: Setup Python (for pip-audit)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip audit (bundled engine runtime)
        run: pip-audit -r scripts/python-requirements.txt --no-deps

      # The wheels committed under vendor/wheels/ are installed from this
      # repository rather than resolved from the lockfile, so the step above
      # cannot see them. They are audited by name and version like any other
      # shipped package -- a vendored pin is frozen, not exempt.
      - name: pip audit (vendored wheels)
        shell: pwsh
        run: |
          $req = @()
          $seenHeader = $false
          foreach ($line in (Get-Content scripts/vendored-wheels.tsv -Encoding UTF8)) {
              if (-not $seenHeader) { if ($line -match '^package\t') { $seenHeader = $true }; continue }
              if (-not $line.Trim()) { continue }
              $c = $line -split "`t"
              if ($c[2].Trim() -eq 'wheel') { $req += "$($c[0].Trim())==$($c[1].Trim())" }
          }
          if (-not $seenHeader) { throw "vendored-wheels.tsv has no header row" }
          $req | Set-Content vendored-audit-requirements.txt
          pip-audit -r vendored-audit-requirements.txt --no-deps
