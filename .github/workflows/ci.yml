name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# Every job below only READS the repository — checkout, install, run gates.
# Nothing here publishes, comments, or writes back, so read access to contents
# is the entire requirement. Declared at the workflow level so a job added later
# inherits the restriction instead of silently getting the default write set;
# a job that genuinely needs more should widen it for ITSELF, not here.
permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Lint (ESLint — errors gate; advisory warnings are not CI noise)
        run: npm run lint -- --quiet

      # The renderer unit tests are a required gate here: lint, build,
      # cargo check and pytest together exercise no application logic.
      # Without this step a pdfjs-dist minor bump can land an empty
      # attachment set and silently break `.pdfx` manifest reading (the
      # whole multi-document format), with only a vitest run catching it.
      # A green build proves the code compiles, not that it works.
      - name: Unit tests (vitest)
        run: npm test

      - name: Build renderer (Vite)
        run: npm run build:renderer

      # The portable zip's payload is the installer's payload, read out of the
      # installer's own generated manifest -- so the two containers cannot list
      # different files. What they CAN drift on is the notice map: a resource
      # added to tauri.conf.json ships in both containers, and the zip's notice
      # gate can only refuse an unclassified directory once a build has written
      # a manifest to read. This runner never bundles, so the check runs against
      # the declarations instead, where the directory is actually added.
      - name: Portable payload notice map covers every declared resource
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1 -CheckMap
        shell: pwsh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Create resource stubs for Tauri build script
        run: |
          mkdir -p resources/python
          mkdir -p resources/fonts
          mkdir -p resources/libreoffice
          mkdir -p resources/tesseract
          mkdir -p resources/jbig2enc
          mkdir -p resources/dictionaries
          mkdir -p resources/icc
        shell: bash

      # `cargo test` rather than `cargo check`: check compiles without running
      # the tests, so the printer, watched-folder and scheduler assertions never
      # execute here. `cargo test` compiles too, so it supersedes the check.
      - name: Rust tests
        run: cd src-tauri && cargo test

      # The COM scheduler tests are #[ignore]d locally because they write to
      # the machine's real task store. The hosted runner IS the fresh machine
      # — no `\Spectra PDF\` folder exists — so this run is the standing
      # fresh-install acceptance for scheduling, on a Server SKU (the class a
      # dev machine cannot reproduce: its folder already exists). RegisterTask
      # is not DOCUMENTED to create missing folders; registration ensures the
      # folder itself rather than leaning on undocumented behavior, and this
      # job is what proves that end to end on every push.
      - name: Rust COM scheduler tests (fresh task store)
        run: cd src-tauri && cargo test scheduler -- --ignored

  test-engine:
    name: Python Engine Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Node.js for staged OCR models
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node dependencies for staged OCR models
        run: npm ci

      # One install per step. The default shell on windows runners reports the
      # step's verdict as the LAST command's exit status, and a native command's
      # non-zero exit does not abort the block, so a failed install in a
      # multi-command block reports success and surfaces only as downstream
      # collection errors.
      - name: Install Python dependencies (shipped, hash-pinned set)
        # The shipped, hash-pinned set rather than a hand-listed subset: a
        # hand-listed one caps what can collect, and installing what ships means
        # a new test file needs no CI edit. `--require-hashes` is stated
        # explicitly to match what setup-python-embed.ps1 installs into the
        # shipped runtime, so this job cannot pass against a set the build
        # would refuse.
        run: pip install --require-hashes -r scripts/python-requirements.txt

      # The rest of the shipped set: the wheels committed under vendor/wheels/,
      # which no index is asked for. Without this the HEIF corpus cannot decode.
      - name: Install the vendored wheels (the rest of the shipped set)
        run: powershell -ExecutionPolicy Bypass -File scripts/install-vendored-wheels.ps1

      - name: Install pytest
        run: pip install pytest

      - name: Stage the committed ICC colour profiles
        # Engine tests exercise CMYK/PDF-X paths directly, outside the Tauri
        # package job. A clean runner has no resources/icc tree until the same
        # gated staging script used by the release build creates it.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-icc.ps1
        shell: pwsh

      - name: Stage the shipped edit fonts
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-edit-fonts.ps1
        shell: pwsh

      - name: Stage the shipped signature script faces
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-signature-fonts.ps1
        shell: pwsh

      - name: Stage the shipped LibreOffice runtime
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-libreoffice.ps1
        shell: pwsh

      - name: Stage the shipped native Tesseract runtime
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-tesseract.ps1
        shell: pwsh

      - name: Stage the shipped JBIG2 encoder
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-jbig2enc.ps1
        shell: pwsh

      - name: Stage the shipped spelling dictionaries
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-dictionaries.ps1
        shell: pwsh

      - name: Stage the shipped Finnish spelling runtime
        # Must follow dictionaries (which rebuilds the tree) and Tesseract
        # (whose MinGW runtime DLLs the Finnish runtime deliberately reuses).
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-voikko.ps1
        shell: pwsh

      - name: Stage the shipped OCR language models
        run: node scripts/sync-ocr-assets.mjs
        shell: pwsh

      - name: Stage test-only SoftHSM (PKCS#11 capability axis)
        # Not an application dependency: this pinned software token gives the
        # hardware-token signing path a real PKCS#11 module on a clean runner.
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-test-softhsm.ps1
        shell: pwsh

      # The Ghent PDF Output Suite is fetched, never committed (its notice
      # permits use for testing workflow setup and forbids redistribution), so
      # the corpus axis has to be staged here or its gate skips on a clean
      # runner and the zero-skip gate refuses the run. The cache is keyed on
      # the fetch script, which is where the archive digests are pinned: GWG's
      # server is contacted on a pin change, not once per run. A cache MISS
      # still fetches and still verifies the pins; either path then re-verifies
      # the extracted tree against the per-file manifest, so a truncated or
      # tampered cache entry fails the job instead of degrading to a skip.
      - name: Cache the Ghent PDF Output Suite corpus
        id: ghent-cache
        uses: actions/cache@v6
        with:
          path: ghent-corpus
          key: ${{ runner.os }}-ghent-suite-${{ hashFiles('scripts/fetch-ghent-suite.py') }}

      - name: Fetch the Ghent PDF Output Suite corpus
        if: steps.ghent-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch-ghent-suite.py

      - name: Verify the Ghent corpus against its manifest
        run: python scripts/fetch-ghent-suite.py --check

      # The GWG Processing Steps Test Suite, same posture and same reasoning
      # as the Ghent corpus above: published for testing workflow setup, never
      # committed, keyed on its own fetch script because that file holds the
      # archive digest pin.
      - name: Cache the GWG Processing Steps Test Suite corpus
        id: processing-steps-cache
        uses: actions/cache@v6
        with:
          path: processing-steps-corpus
          key: ${{ runner.os }}-processing-steps-suite-${{ hashFiles('scripts/fetch-processing-steps-suite.py') }}

      - name: Fetch the GWG Processing Steps Test Suite corpus
        if: steps.processing-steps-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch-processing-steps-suite.py

      - name: Verify the Processing Steps corpus against its manifest
        run: python scripts/fetch-processing-steps-suite.py --check

      # The PDF/A conformance corpus (bfocom + veraPDF): fetched, never
      # committed — neither upstream declares a licence, so redistribution
      # terms cannot be satisfied and the files stay on disk. The clause-map
      # gate reads the DERIVED clause index, so the index is rebuilt on every
      # run from whatever the cache restored; the fetch itself is keyed on the
      # fetch script, which is where the commit SHA pins live.
      - name: Cache the PDF/A conformance corpus
        id: pdfa-corpus-cache
        uses: actions/cache@v6
        with:
          path: pdfa-corpus
          key: ${{ runner.os }}-pdfa-corpus-${{ hashFiles('scripts/fetch-pdfa-corpus.py') }}

      - name: Fetch the PDF/A conformance corpus
        if: steps.pdfa-corpus-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch-pdfa-corpus.py

      - name: Build the PDF/A clause index
        run: python scripts/pdfa-clause-index.py

      - name: Verify the PDF/A corpus and its clause index
        run: python scripts/fetch-pdfa-corpus.py --check

      - name: Install Ghostscript as a TEST TOOL (capability-present axis)
        # This does not vendor Ghostscript into Spectra PDF. The clean runner
        # installs the current Chocolatey package like an end user would; the
        # product probe, not this workflow, enforces the minimum version.
        run: choco install ghostscript -y --no-progress
        shell: pwsh

      - name: Export the test Ghostscript path
        # The Windows installer registers Ghostscript but does not necessarily
        # add it to this already-running Actions worker's PATH. Python has no
        # access to the Rust registry resolver, so give its shared capability
        # authority the executable that was actually installed.
        run: |
          $candidates = @(Get-ChildItem "${env:ProgramFiles}\gs\gs*\bin\gswin64c.exe" -File -ErrorAction Stop)
          if ($candidates.Count -ne 1) { throw "Expected one installed Ghostscript, found $($candidates.Count)" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SPECTRAPDF_GS_PATH=$($candidates[0].FullName)" -Encoding utf8
        shell: pwsh

      - name: Run engine tests (full suite)
        run: python -m pytest tests/ -q
        env:
          SPECTRAPDF_REQUIRE_ZERO_SKIPS: "1"

  audit:
    name: Dependency Audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production)
        run: npm audit --production --audit-level=high

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: cargo audit
        run: cd src-tauri && cargo audit

      # The third dependency graph. npm audit and cargo audit between them
      # cover the renderer and the Rust backend, but the PYTHON engine ships
      # inside the installer and is the code that parses untrusted PDFs
      # (pikepdf/qpdf, pdfminer.six, Pillow, lxml, cryptography) -- until now
      # nothing checked it. Audited against the hash-pinned lockfile, which is
      # exactly what setup-python-embed.ps1 installs into the shipped runtime.
      - name: Setup Python (for pip-audit)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip audit (bundled engine runtime)
        run: pip-audit -r scripts/python-requirements.txt --no-deps

      # The wheels committed under vendor/wheels/ are installed from this
      # repository rather than resolved from the lockfile, so the step above
      # cannot see them. They are audited by name and version like any other
      # shipped package -- a vendored pin is frozen, not exempt.
      - name: pip audit (vendored wheels)
        shell: pwsh
        run: |
          $req = @()
          $seenHeader = $false
          foreach ($line in (Get-Content scripts/vendored-wheels.tsv -Encoding UTF8)) {
              if (-not $seenHeader) { if ($line -match '^package\t') { $seenHeader = $true }; continue }
              if (-not $line.Trim()) { continue }
              $c = $line -split "`t"
              if ($c[2].Trim() -eq 'wheel') { $req += "$($c[0].Trim())==$($c[1].Trim())" }
          }
          if (-not $seenHeader) { throw "vendored-wheels.tsv has no header row" }
          $req | Set-Content vendored-audit-requirements.txt
          pip-audit -r vendored-audit-requirements.txt --no-deps

  e2e:
    name: E2E (WebdriverIO + tauri-driver)
    # DISABLED: no WebDriver session can be created on a hosted runner.
    # Hosted runners execute jobs elevated and the image runs UAC-disabled;
    # a -RunLevel Limited scheduled task and a SAFER restricted token both
    # still run at High IL (in-child TOKEN-IL banners show it), so no
    # de-elevation primitive exists there and every session fails at
    # creation. WebView2 v150 deliberately drops the user-writable config
    # channels (WEBVIEW2_* environment variables, HKCU policy) for an
    # elevated host, and MicrosoftEdge/WebView2Feedback#5640 is CLOSED AS
    # BY DESIGN, so there is no upstream fix to wait for.
    #
    # HKLM policy is the surviving channel Microsoft names, and it is not
    # sufficient for this chain: the policy applies (the step below echoes
    # AdditionalBrowserArguments = --remote-debugging-port=9222 back) and
    # the session still fails `DevToolsActivePort file doesn't exist`. The
    # likely cause, reasoned rather than verified: msedgedriver also passes
    # the profile location via WEBVIEW2_USER_DATA_FOLDER, the same dropped
    # channel class, so the webview writes DevToolsActivePort into its
    # default profile while the driver watches the folder it intended.
    # Setting the arguments from app code does not fix that half.
    #
    # Do NOT pin a Fixed Version 149 runtime: users are evergreen on 150,
    # where the app works (the regression only gates elevated debugger
    # attach), so a pinned CI runtime tests what nobody runs and rots (see
    # CLAUDE.md's never-pin rule).
    #
    # The open options are a SELF-HOSTED runner running as a normal user
    # (the local suite proves the stack is fine non-elevated), or leaving
    # the local 101-spec suite as the release gate, which is the status
    # quo. That suite runs on the rebuilt binary and its green is recorded
    # per milestone.
    if: false
    runs-on: windows-latest
    # The job cap is a backstop, not the failure detector — the pre-flight
    # step below is what catches "no session can be created at all" (runner
    # image drift) in minutes instead of grinding 101 specs' worth of session
    # retries into this cap and reporting a useless grey "cancelled".
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Node dependencies (root)
        run: npm ci

      - name: Install Node dependencies (e2e)
        run: npm ci
        working-directory: e2e-tests

      - name: Provision embedded Python for engine sidecar
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-python-embed.ps1
        shell: pwsh

      - name: Create resource stubs for the Tauri build script
        # `--no-bundle` does NOT skip resource validation: without the stubs this
        # job fails with a missing-resource error for resources/libreoffice. Every
        # path in tauri.conf.json must EXIST at build time; an empty dir satisfies it.
        # tauri.conf.json must EXIST at build time; an empty dir satisfies it.
        # fonts and libreoffice are stubbed rather than vendored because this job
        # is currently a WebView2 experiment — the specs that genuinely need them
        # (font fallback, 56-office-export) will fail until they are vendored for
        # real, and that is a separate decision about CI minutes.
        run: |
          mkdir -p resources/fonts
          mkdir -p resources/libreoffice
          mkdir -p resources/jbig2enc
          mkdir -p resources/dictionaries
        shell: bash

      - name: Vendor the ICC colour profiles (committed under vendor/icc)
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-icc.ps1
        shell: pwsh

      - name: Install Ghostscript as a TEST TOOL (the capability-present e2e axis)
        # Ghostscript is not shipped: the product discovers a user-installed one
        # and disables its dependent features when none is configured. The
        # capability-PRESENT axis of the suite (11-compare's visual mode drives
        # the real raster) still needs a real Ghostscript on the machine, so this
        # job installs one the way a user would. Tests may use tools the product
        # does not ship. No version pin: the installer publishes what it
        # publishes, and the capability probe enforces the minimum version.
        run: choco install ghostscript -y --no-progress
        shell: pwsh

      # Vendoring and staging are separate steps: a failed vendoring in a
      # multi-command block would be masked by the staging command's exit
      # status and reported as success.
      - name: Vendor native Tesseract
        # Phase 12 made recognition native and engine-side, so 14-ocr-find and
        # 40-batch-ocr now need the real tesseract.exe and real traineddata —
        # a stub would fail them for a reason that has nothing to do with the
        # WebView2 experiment this job is testing.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-tesseract.ps1
        shell: pwsh

      - name: Stage OCR language models
        # Staging MUST follow the vendoring: the script supplies
        # tessdata/configs (TSV word-box output) and osd, which
        # sync-ocr-assets.mjs then adds the 47 models beside.
        run: node scripts/sync-ocr-assets.mjs
        shell: pwsh

      - name: Build Tauri binary (debug, frontend embedded, no installer)
        run: npx tauri build --debug --no-bundle
        env:
          VITE_E2E: "1"

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install msedgedriver matching runner WebView2 Runtime
        # msedgedriver-tool resolves against the installed WebView2 RUNTIME
        # (registry pv of the EdgeUpdate WebView2 client), not Edge-the-browser
        # — the step's old name said "Edge" and misled a whole investigation.
        # wdio.conf.ts onPrepare re-runs the tool anyway (self-healing rule);
        # this step exists to have the tool compiled + on PATH.
        # The Push-Location/Pop-Location pair keeps this one step, so each
        # native command's exit status is checked explicitly: a non-zero exit
        # does not abort a pwsh block, and only the last command's status
        # becomes the step's verdict.
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          if ($LASTEXITCODE -ne 0) { throw "cargo install msedgedriver-tool exited $LASTEXITCODE" }
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          Push-Location $cargoBin
          msedgedriver-tool
          $toolExit = $LASTEXITCODE
          Pop-Location
          if ($toolExit -ne 0) { throw "msedgedriver-tool exited $toolExit" }
          echo "$cargoBin" >> $env:GITHUB_PATH
        shell: pwsh

      # WebView2 Runtime 150 deliberately IGNORES the user-writable config
      # channels when the host process is elevated (a local privilege-escalation
      # hardening): WEBVIEW2_* environment variables and HKCU policy are both
      # dropped. That is our failure exactly — msedgedriver passes
      # --remote-debugging-port through WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS,
      # which works in a normal shell and is silently discarded on an elevated
      # runner, so no DevToolsActivePort file is ever written and every session
      # fails.
      #
      # Upstream MicrosoftEdge/WebView2Feedback#5640 is CLOSED AS BY DESIGN —
      # there is no fix to wait for. Microsoft's own guidance names the two
      # channels that survive elevation, and HKLM policy is the one available to
      # a CI runner (runners are elevated, so we can write it).
      #
      # De-elevation is not available on this image: a -RunLevel Limited
      # scheduled task and `runas /trustlevel` both execute at High
      # integrity (in-child TOKEN-IL banners), because the image runs
      # UAC-disabled and grants no path down.
      #
      # The open unknown is the port handshake: msedgedriver chooses a port
      # itself and then reads the actual one back out of the
      # DevToolsActivePort file, so a fixed policy port may or may not
      # satisfy it. The pre-flight below is deliberately one spec, so a
      # failure costs minutes and names itself instead of grinding the
      # whole suite.
      - name: Enable DevTools via HKLM policy (survives elevation)
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name 'AdditionalBrowserArguments' `
            -Value '--remote-debugging-port=9222' -Type String
          Get-ItemProperty -Path $key | Select-Object AdditionalBrowserArguments

      - name: Session pre-flight (fail fast on runner-image drift)
        timeout-minutes: 12
        shell: pwsh
        working-directory: e2e-tests
        run: npx wdio run wdio.conf.ts --spec specs/01-boot.spec.ts

      # DISABLED. The question this job answers is narrow: does the HKLM
      # policy channel restore the DevTools endpoint for an elevated host?
      # The pre-flight above answers it in minutes. Running the full suite
      # would also fail on the stubbed fonts/libreoffice above and muddy
      # the result. Re-enable once the pre-flight is green AND those are
      # vendored.
      - name: Run WebdriverIO suite
        if: false
        timeout-minutes: 40
        shell: pwsh
        working-directory: e2e-tests
        run: npm test

      - name: Dump WebView2 crash diagnostics
        if: failure()
        shell: pwsh
        run: |
          try {
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001} -MaxEvents 40 -ErrorAction Stop |
              Where-Object { $_.Message -match 'msedgewebview2|spectrapdf|msedgedriver' } |
              Format-List TimeCreated, Id, Message
          } catch { Write-Host "no matching crash events" }
          try {
            Get-ChildItem "$env:TEMP" -Filter "*EBWebView*" -Recurse -Depth 2 -ErrorAction Stop |
              Select-Object -First 20 -ExpandProperty FullName
          } catch { Write-Host "no EBWebView temp dirs" }
