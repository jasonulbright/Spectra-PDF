name: Release

# Tag a version (e.g. v0.9.0) to build, sign, verify, and publish a GitHub
# release. Assets land on a DRAFT; the verification gates run against the
# uploaded assets; the last step of the job undrafts. A failed gate leaves a
# draft nobody can download. The updater manifest (latest.json) is generated
# and signed automatically by tauri-action because the updater is configured
# with a pubkey and bundle.createUpdaterArtifacts is enabled.
on:
  push:
    tags:
      # Version tags only: "v*" also matches non-release tags such as the
      # vendor cache tag, which starts a release run for a tag with no version.
      - "v[0-9]*"

permissions:
  contents: write

env:
  # Non-secret signing coordinates. The account and profile name what signs;
  # the subject is what the publish gate requires to have signed.
  SPECTRAPDF_SIGN_ENDPOINT: https://eus.codesigning.azure.net
  SPECTRAPDF_SIGN_ACCOUNT: signalridgelabs
  SPECTRAPDF_SIGN_PROFILE: SRL-Public
  SPECTRAPDF_SIGN_SUBJECT_CN: Jason Ulbright

# The candidate's full functional validation is performed once locally.
# This workflow builds the signed deliverables and verifies the uploaded bytes.
jobs:
  verify:
    name: Verify version consistency
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches every version surface
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -creplace '^v',''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                    Select-Object -First 1).Matches.Groups[1].Value
          Write-Host "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          $bad = @()
          if ($pkg   -cne $tag) { $bad += "package.json ($pkg)" }
          if ($conf  -cne $tag) { $bad += "tauri.conf.json ($conf)" }
          if ($cargo -cne $tag) { $bad += "Cargo.toml ($cargo)" }
          if ($bad) { throw "Tag $tag disagrees with: $($bad -join ', ')" }

  release:
    name: Build & publish (Windows)
    needs: verify
    runs-on: windows-latest
    # Gates the OIDC federated credential: the app registration trusts this
    # repository only through this environment.
    environment: release
    permissions:
      contents: write
      id-token: write
    # Without this the job inherits GitHub's 6-hour default. The vendoring
    # steps download large artifacts from volunteer mirrors, and a mirror that
    # accepts the connection but never sends data would hang rather than fail
    # -- burning hours of Actions time and reporting nothing useful. Successful
    # releases run ~35-40 min, so 90 is generous headroom that still fails
    # visibly. (The LibreOffice step also retries mirrors; this is the backstop
    # for the case retrying cannot fix.)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      # Authenticode signing runs inside the bundler: `signCommand` in
      # tauri.conf.json invokes scripts/sign-windows.ps1 for the app executable
      # before NSIS packs it and for the installer afterwards, so the portable
      # zip -- which copies the executable the installer stages -- carries the
      # same signature. The client tools supply the signtool build that loads
      # the signing dlib; the dlib takes its token from the Azure login below.
      - name: Install the Artifact Signing client tools
        # Avoid an unattended MSI install; the existing NuGet branch extracts
        # the same client payload without winget or Windows Installer.
        timeout-minutes: 5
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/install-signing-tools.ps1 -SkipWinget

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Node dependencies
        run: npm ci

      - name: Provision embedded Python (vendored)
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-python-embed.ps1
        shell: pwsh

      - name: Vendor the ICC colour profiles (committed under vendor/icc)
        # The profiles are committed to this repository, so this step reads no
        # network and needs no credential. Every file is sha256-verified against
        # scripts/icc-profiles.tsv on the way out and again on disk, and the
        # notice gate refuses to write the tree when a row lacks its notice.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-icc.ps1
        shell: pwsh

      - name: Vendor edit fonts (Liberation family, 12 faces, sha256-pinned)
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-edit-fonts.ps1
        shell: pwsh

      - name: Vendor signature script faces (3 faces, OFL 1.1, sha256-pinned)
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-signature-fonts.ps1
        shell: pwsh

      - name: Cache the pinned LibreOffice msi
        id: libreoffice-msi-cache-build
        uses: actions/cache@v6
        with:
          path: .lo-msi-cache
          key: ${{ runner.os }}-libreoffice-msi-${{ hashFiles('scripts/bundle-libreoffice.ps1') }}

      - name: Vendor LibreOffice (Office export runtime, MPL-2.0)
        # Self-sufficient: the runner has no LibreOffice, so the script downloads
        # its PINNED, checksum-verified stable .msi (the default in the script).
        # No repo variable, no manual setup. To bump the version, edit
        # $Version/$ExpectedSha256 in the script.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-libreoffice.ps1
        env:
          SPECTRAPDF_LO_MSI_CACHE: .lo-msi-cache

      - name: Vendor native Tesseract
        # Recognition is native Tesseract as a subprocess (the GUI, the
        # CLI and every scheduled run share it). Pinned + SHA-256 verified in the
        # script; extracted from the NSIS installer with 7-Zip, never run.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-tesseract.ps1

      - name: Vendor jbig2enc (MRC mask codec, Apache-2.0)
        # The JBIG2 encoder for MRC's 1-bit text stencil. Official prebuilt
        # Windows x64 MSVC release asset, SHA-256 pinned in the script, driven
        # as a subprocess (the Ghostscript pattern). The script REFUSES to ship
        # if any statically-linked component named in upstream's depmf.json
        # lacks a row in scripts/jbig2enc-licenses.tsv.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-jbig2enc.ps1

      - name: Vendor spelling dictionaries
        # 35 Hunspell .aff/.dic pairs from LibreOffice/dictionaries at the
        # commit pinned in the script, each file SHA-256 verified against
        # scripts/dictionaries.tsv. The script REFUSES to write the tree if any
        # tag ships a dictionary with no notice row (the jbig2enc precedent).
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-dictionaries.ps1
        shell: pwsh

      - name: Vendor the Finnish morphological analyser
        # Finnish words are generated, not listed, so the fi tag ships
        # libvoikko plus the voikko-fi transducer instead of an .aff/.dic pair.
        # Two pinned archives, SHA-256 verified before extraction and every
        # extracted file again against scripts/voikko.tsv. Must run AFTER the
        # step above, which rebuilds resources/dictionaries wholesale, and after
        # the Tesseract step, whose mingw runtime DLLs it copies beside
        # libvoikko-1.dll.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-voikko.ps1
        shell: pwsh

      - name: Stage OCR language models
        # Decompresses the 47 pinned Apache-2.0 models into
        # resources/tesseract/tessdata. Must run AFTER the vendoring step, which
        # supplies tessdata/configs (TSV output) and osd.
        run: node scripts/sync-ocr-assets.mjs
        shell: pwsh

      - name: Stage corresponding source archives
        # The HEIF binding ships two LGPL libraries. Every released installer
        # is accompanied by their exact source and the binding's own sdist;
        # the staging script downloads only the version- and SHA-256-pinned
        # rows in scripts/corresponding-source.tsv.
        run: powershell -ExecutionPolicy Bypass -File scripts/stage-corresponding-source.ps1 -OutputDirectory release-sources
        shell: pwsh

      # The release body and the updater manifest's `notes` are one string,
      # taken from the changelog section for this version. The extractor
      # refuses a missing or empty section, a `Remaining` heading, and the
      # terms that never appear in release notes; it writes LF only, because
      # the draft verifier compares the manifest's `notes` to the release
      # body byte for byte. The local CI-parity battery runs the same
      # extraction for the version the four surfaces carry.
      - name: Release notes from the changelog
        id: notes
        shell: bash
        run: |
          version="${TAG#v}"
          body="$(python scripts/release-notes-from-changelog.py "$version")"
          {
            echo "body<<SPECTRA_NOTES_EOF"
            echo "$body"
            echo "SPECTRA_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref_name }}

      # OIDC: the job's id-token is exchanged for an Azure token through the
      # app registration's federated credential, which is scoped to this
      # environment. No client secret exists to leak or rotate.
      - name: Azure login (federated, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The federated assertion azure/login redeems expires MINUTES after the
      # job's id-token is minted, and the access token cached here is valid for
      # at most 60 minutes. The signing dlib asks the CLI for a token in the
      # signing-service scope, which the login itself does not cache, so every
      # signature the build produces must happen inside that 60-minute window
      # measured from this step. Nothing slow may sit between these two steps
      # and the build below; provisioning belongs above the login.
      - name: Cache a signing-service token
        shell: pwsh
        run: |
          $raw = az account get-access-token --scope https://codesigning.azure.net/.default --output json
          if ($LASTEXITCODE -ne 0) { throw "az account get-access-token failed (exit $LASTEXITCODE)" }
          $token = $raw | ConvertFrom-Json
          Write-Host "signing-service token cached, expires_on: $($token.expires_on)"

      # DRAFT FIRST. Every asset lands on a draft release, every gate below
      # runs against the uploaded assets, and the final step is the only one
      # that undrafts. A gate that fails leaves the draft in place (nothing is
      # downloadable, latest.json is not served) for forward-only remediation;
      # the order is enforced by tests/test_ci_capability_setup.py.
      - name: Build, sign, and upload to a draft release
        id: draft
        # v1's breaking changes do not touch this workflow: no renamed
        # inputs are used, Tauri 2 is stable, the bundles are Windows-only,
        # and notify-only reads just latest.json's version field. The live
        # proof is the next tag's release run.
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing -- store the private key as a repository secret.
          # The key has no password, so the password is an empty string (no secret needed).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          SPECTRAPDF_SIGN: "1"
          SPECTRAPDF_SIGN_ENDPOINT: ${{ env.SPECTRAPDF_SIGN_ENDPOINT }}
          SPECTRAPDF_SIGN_ACCOUNT: ${{ env.SPECTRAPDF_SIGN_ACCOUNT }}
          SPECTRAPDF_SIGN_PROFILE: ${{ env.SPECTRAPDF_SIGN_PROFILE }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      # The bundler discards the sign command's stdout and stderr and reports
      # only "failed to run powershell", so the script's own log is the only
      # record of why a signing invocation failed. Printed whatever the build
      # did: a build that succeeded still shows which files were signed.
      - name: Print the signing logs
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "sign-windows"
          if (-not (Test-Path -LiteralPath $dir)) {
            Write-Host "no sign-windows logs"
            return
          }
          $logs = @(Get-ChildItem -LiteralPath $dir -File | Sort-Object Name)
          if ($logs.Count -eq 0) {
            Write-Host "no sign-windows logs"
            return
          }
          foreach ($log in $logs) {
            Write-Host "===== $($log.Name) ====="
            Get-Content -LiteralPath $log.FullName | Write-Host
          }

      # Exercise the Python runtime vendored on this runner in the built app.
      # A malformed runtime or missing DLL must leave the draft unpublished.
      - name: Built CLI starts the vendored engine
        timeout-minutes: 2
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/spectrapdf.exe'
          $fixture = 'tests/fixtures/sample.pdf'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'built CLI is missing' }
          if (-not (Test-Path -LiteralPath $fixture -PathType Leaf)) { throw 'CLI fixture is missing' }
          $stdout = Join-Path $env:RUNNER_TEMP 'spectrapdf-cli-smoke.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'spectrapdf-cli-smoke.err'
          $process = Start-Process -FilePath (Resolve-Path $exe).Path `
            -ArgumentList @('check', $fixture) -WorkingDirectory (Get-Location).Path `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "built CLI failed (exit $($process.ExitCode)): $(Get-Content $stderr -Raw)"
          }
          $report = Get-Content $stdout -Raw | ConvertFrom-Json
          if ($report.valid -ne $true -or $report.size_bytes -le 0) {
            throw "built CLI did not validate the fixture: $(Get-Content $stdout -Raw)"
          }

      # The portable distribution: the SAME payload the installer lays down,
      # in a zip instead of an installer. Its tree is read out of the
      # installer's own generated manifest (installer.nsi) rather than from a
      # second list, so a resource added to tauri.conf.json reaches both
      # containers or neither. Must run AFTER the bundle step, which is what
      # writes that manifest. The bundled-binary notice gate applies here
      # exactly as it does to the installer, and refuses with exit 1.
      - name: Build the portable zip
        # Tauri restores its unsigned build output after NSIS; read the signed
        # app from the completed installer. All three signatures gate BEFORE
        # portable compression, with no fourth signing-service call.
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1 -ExpectSigned
        shell: pwsh

      # The gate the design calls for: the zip's tree, compared entry by entry
      # against the installer's staging manifest. It cannot drift by
      # construction, and this proves the construction on every release rather
      # than assuming it.
      - name: Verify the portable tree against the installer's staging
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1 -ExpectSigned -Verify src-tauri/target/release/bundle/portable/tree.staging
        shell: pwsh

      - name: Portable payload notice map covers every declared resource
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1 -CheckMap
        shell: pwsh

      # The publish gate for signing: the installer and the executable the
      # portable zip carries must both be chain-valid, signed by the expected
      # subject, and timestamped. A failure here leaves the draft unpublished.
      - name: Verify the Authenticode signatures on the built artifacts
        shell: pwsh
        run: |
          . ./scripts/windows-signing.ps1
          $installer = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installer.Count -ne 1) { throw "expected one installer to verify, found $($installer.Count)" }
          Assert-AuthenticodeSigned -Path $installer[0].FullName -ExpectedSubjectCommonName $env:SPECTRAPDF_SIGN_SUBJECT_CN
          $zips = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -File)
          if ($zips.Count -ne 1) { throw "expected one portable zip to verify, found $($zips.Count)" }
          $extracted = Join-Path ([System.IO.Path]::GetTempPath()) "portable-signature-check"
          if (Test-Path -LiteralPath $extracted) { Remove-Item -LiteralPath $extracted -Recurse -Force }
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath $extracted
          $exes = @(Get-ChildItem -LiteralPath $extracted -Recurse -Filter "spectrapdf.exe" -File)
          if ($exes.Count -ne 1) { throw "expected one spectrapdf.exe in the portable zip, found $($exes.Count)" }
          Assert-AuthenticodeSigned -Path $exes[0].FullName -ExpectedSubjectCommonName $env:SPECTRAPDF_SIGN_SUBJECT_CN

      # The shipped tree itself, after both containers are assembled: a
      # `resources` directory entry is copied whole, so an engine source tree
      # carrying ignored __pycache__ would put cached bytecode in the installer
      # and the zip alike. Mirrored in scripts/ci-parity-gates.sh.
      - name: Engine payload manifest is current
        run: python scripts/gen-engine-payload-manifest.py --check
        shell: bash

      - name: Engine payload matches its manifest
        run: python scripts/check-engine-payload.py
        shell: bash

      # The renderer tree the binary embedded: the e2e harness is compiled out
      # by VITE_E2E, and a leaked variable would ship a raw dispatcher that
      # bypasses the commit gate. Mirrored in scripts/ci-parity-gates.sh.
      - name: Shipped renderer carries no test harness
        run: python scripts/check-release-bundle.py
        shell: bash

      # Uploads address the draft by its id: a draft has no tag ref, so a
      # tag-addressed upload could resolve to a different (public) release.
      - name: Upload the portable zip to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $zips = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -ErrorAction Stop)
          if ($zips.Count -ne 1) { throw "expected one portable zip, found $($zips.Count)" }
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($file in $zips) {
            foreach ($stale in @($assets | Where-Object name -ceq $file.Name)) {
              gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
              if ($LASTEXITCODE -ne 0) { throw "failed to replace $($file.Name)" }
            }
            $name = [uri]::EscapeDataString($file.Name)
            gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$name" --input $file.FullName > $null
            if ($LASTEXITCODE -ne 0) { throw "failed to upload $($file.Name)" }
          }

      - name: Upload corresponding source archives to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $files = @(Get-ChildItem release-sources -File -ErrorAction Stop)
          if (-not $files) { throw "no corresponding-source archives were staged" }
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($file in $files) {
            foreach ($stale in @($assets | Where-Object name -ceq $file.Name)) {
              gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
              if ($LASTEXITCODE -ne 0) { throw "failed to replace $($file.Name)" }
            }
            $name = [uri]::EscapeDataString($file.Name)
            gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$name" --input $file.FullName > $null
            if ($LASTEXITCODE -ne 0) { throw "failed to upload $($file.Name)" }
          }

      # The installer is UNSIGNED, so a published checksum is the only way a
      # cautious user can confirm the file they downloaded is the file this
      # workflow built.
      - name: Upload SHA-256 checksums to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem $bundle -Filter "*-setup.exe" -ErrorAction Stop)
          if (-not $installers) { throw "no installer found in $bundle to checksum" }
          $sources = @(Get-ChildItem release-sources -File -ErrorAction Stop)
          if (-not $sources) { throw "no corresponding-source archives found to checksum" }
          # The portable zip is unsigned for the same reason the installer is,
          # so it needs its checksum for the same reason -- and it sits in the
          # same file, beside the installer, rather than in one of its own.
          $portable = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -ErrorAction Stop)
          if ($portable.Count -ne 1) { throw "expected one portable zip to checksum, found $($portable.Count)" }
          $files = @($installers) + @($portable) + @($sources)
          # The name column is the name GitHub serves the asset under, not the
          # build directory's: this file is verified with `sha256sum -c` beside
          # downloaded files, and GitHub rewrites a space in an uploaded asset
          # name. One rule, shared with the draft verifier.
          . ./scripts/github-asset-name.ps1
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            "$h  $(Get-GitHubAssetName $f.Name)"
          }
          $out = Join-Path $bundle "SHA256SUMS.txt"
          # ASCII + LF: this file is consumed by `sha256sum -c` as often as by eye.
          [System.IO.File]::WriteAllText($out, ($lines -join "`n") + "`n", [System.Text.ASCIIEncoding]::new())
          Get-Content $out
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($stale in @($assets | Where-Object name -ceq "SHA256SUMS.txt")) {
            gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
            if ($LASTEXITCODE -ne 0) { throw "failed to replace SHA256SUMS.txt" }
          }
          gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=SHA256SUMS.txt" --input $out > $null
          if ($LASTEXITCODE -ne 0) { throw "failed to upload SHA256SUMS.txt" }

      # Read back what the draft actually holds, not what this runner built:
      # every asset is downloaded by id and hashed, and the uploaded bytes must
      # equal the built bytes, the uploaded SHA256SUMS.txt, and the uploaded
      # signature that latest.json carries. A size match is not a check. A
      # draft that is already public here means some earlier step published;
      # that is refused, never repaired. Contract in the script's header.
      - name: Verify the draft's assets and updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: pwsh -NoProfile -File scripts/verify-release-draft.ps1 -Repo "${{ github.repository }}" -ReleaseId $env:RELEASE_ID -Tag "${{ github.ref_name }}" -ExpectSigned

      # The ONLY step that makes anything public. Must stay last.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $repo = "${{ github.repository }}"
          $release = gh api --method PATCH "repos/$repo/releases/$env:RELEASE_ID" -F draft=false -F prerelease=false | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft) { throw "release $env:RELEASE_ID did not publish" }
          Write-Host "published $($release.html_url)"
