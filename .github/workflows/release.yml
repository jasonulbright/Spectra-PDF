name: Release

# Tag a version (e.g. v0.9.0) to build, sign, and publish a GitHub release.
# The updater manifest (latest.json) is generated and signed automatically by
# tauri-action because the updater is configured with a pubkey and
# bundle.createUpdaterArtifacts is enabled.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The gate for `release`. A tag can be pushed at any commit, so CI running on
  # push/PR does not establish that the tagged commit passed anything.
  #
  # Self-contained rather than keyed off CI's status: a workflow that reads
  # another workflow's conclusion is one API shape away from silently passing,
  # and re-running the suites costs minutes on a job that already takes ~35.
  #
  # E2E is not here and must not be faked: it is blocked upstream (see
  # ci.yml). The full local suite on the built binary is the release gate, a
  # manual precondition recorded per milestone.
  verify:
    name: Verify (gates + version consistency)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The tag IS the version claim. A tag that disagrees with the manifests
      # publishes an installer whose in-app version, updater manifest and
      # filename do not match the release it lives in -- and the updater
      # compares version NUMBERS, so a mismatch strands users.
      - name: Tag matches every version surface
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                    Select-Object -First 1).Matches.Groups[1].Value
          Write-Host "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          $bad = @()
          if ($pkg   -ne $tag) { $bad += "package.json ($pkg)" }
          if ($conf  -ne $tag) { $bad += "tauri.conf.json ($conf)" }
          if ($cargo -ne $tag) { $bad += "Cargo.toml ($cargo)" }
          if ($bad) { throw "Tag $tag disagrees with: $($bad -join ', ')" }

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --quiet

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build renderer (Vite)
        run: npm run build:renderer

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-verify-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Create resource stubs for Tauri build script
        run: |
          mkdir -p resources/python
          mkdir -p resources/fonts
          mkdir -p resources/libreoffice
          mkdir -p resources/tesseract
          mkdir -p resources/jbig2enc
          mkdir -p resources/dictionaries
          mkdir -p resources/icc
        shell: bash

      # `cargo check` never RUNS anything. The Rust tests cover the virtual
      # printer's job naming, the watched-folder validation and the scheduler --
      # all of which decide what lands on a user's disk.
      - name: Rust tests
        run: cd src-tauri && cargo test

      # Fresh-install scheduling acceptance: the runner has no `\Spectra PDF\`
      # task folder, so the #[ignore]d COM round-trips register into a genuinely
      # fresh store here (registration ensures its folder rather than leaning
      # on undocumented RegisterTask behavior; see ci.yml for the full note).
      - name: Rust COM scheduler tests (fresh task store)
        run: cd src-tauri && cargo test scheduler -- --ignored

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # One install per step. The default shell on windows runners reports the
      # step's verdict as the LAST command's exit status, and a native command's
      # non-zero exit does not abort the block, so a failed install in a
      # multi-command block reports success and surfaces only as downstream
      # collection errors. `--require-hashes` is stated explicitly to match what
      # setup-python-embed.ps1 installs into the shipped runtime.
      - name: Install Python dependencies (the SHIPPED, hash-pinned set)
        run: pip install --require-hashes -r scripts/python-requirements.txt

      # The rest of the shipped set: the wheels committed under vendor/wheels/,
      # which no index is asked for. Without this the HEIF corpus cannot decode.
      - name: Install the vendored wheels (the rest of the shipped set)
        run: powershell -ExecutionPolicy Bypass -File scripts/install-vendored-wheels.ps1

      - name: Install pytest
        run: pip install pytest

      - name: Stage the committed ICC colour profiles for engine tests
        # The verify job is a clean checkout and runs the engine before the
        # build job vendors resources. Use the release bundler here too so the
        # tested bytes and the installer bytes are governed by the same hashes.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-icc.ps1
        shell: pwsh

      - name: Stage the shipped edit fonts for engine tests
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-edit-fonts.ps1
        shell: pwsh

      - name: Stage the shipped signature script faces for engine tests
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-signature-fonts.ps1
        shell: pwsh

      # 373 MB off TDF's mirror network on EVERY run otherwise. The key is the
      # bundle script because that file IS the pin (version + SHA-256), and the
      # cached file is named for the checksum, so a restore that does not match
      # the pin falls through to a download instead of poisoning the tree.
      - name: Cache the pinned LibreOffice msi
        id: libreoffice-msi-cache
        uses: actions/cache@v6
        with:
          path: .lo-msi-cache
          key: ${{ runner.os }}-libreoffice-msi-${{ hashFiles('scripts/bundle-libreoffice.ps1') }}

      - name: Stage the shipped LibreOffice runtime for engine tests
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-libreoffice.ps1
        shell: pwsh
        env:
          SPECTRAPDF_LO_MSI_CACHE: .lo-msi-cache

      - name: Stage the shipped native Tesseract runtime for engine tests
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-tesseract.ps1
        shell: pwsh

      - name: Stage the shipped JBIG2 encoder for engine tests
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-jbig2enc.ps1
        shell: pwsh

      - name: Stage the shipped spelling dictionaries for engine tests
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-dictionaries.ps1
        shell: pwsh

      - name: Stage the shipped Finnish spelling runtime for engine tests
        # Must follow dictionaries and Tesseract for the same dependency order
        # the release build itself uses below.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-voikko.ps1
        shell: pwsh

      - name: Stage the shipped OCR language models for engine tests
        run: node scripts/sync-ocr-assets.mjs
        shell: pwsh

      - name: Stage test-only SoftHSM for PKCS#11 engine tests
        # This is a pinned test fixture, not part of the published installer.
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-test-softhsm.ps1
        shell: pwsh

      # Fetched, never committed: the suite's notice permits use for testing
      # workflow setup and forbids redistribution. Without this the Ghent gate
      # skips and the zero-skip gate below refuses the run. Keyed on the fetch
      # script, which holds the archive digest pins, so a run hits GWG's server
      # only when a pin moves. A MISS still fetches and verifies the pins, and
      # both paths re-verify the extracted tree against the per-file manifest.
      - name: Cache the Ghent PDF Output Suite corpus
        id: ghent-cache
        uses: actions/cache@v6
        with:
          path: ghent-corpus
          key: ${{ runner.os }}-ghent-suite-${{ hashFiles('scripts/fetch-ghent-suite.py') }}

      - name: Fetch the Ghent PDF Output Suite corpus
        if: steps.ghent-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch-ghent-suite.py

      - name: Verify the Ghent corpus against its manifest
        run: python scripts/fetch-ghent-suite.py --check

      # The GWG Processing Steps Test Suite, same posture and same reasoning
      # as the Ghent corpus above: published for testing workflow setup, never
      # committed, keyed on its own fetch script because that file holds the
      # archive digest pin.
      - name: Cache the GWG Processing Steps Test Suite corpus
        id: processing-steps-cache
        uses: actions/cache@v6
        with:
          path: processing-steps-corpus
          key: ${{ runner.os }}-processing-steps-suite-${{ hashFiles('scripts/fetch-processing-steps-suite.py') }}

      - name: Fetch the GWG Processing Steps Test Suite corpus
        if: steps.processing-steps-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch-processing-steps-suite.py

      - name: Verify the Processing Steps corpus against its manifest
        run: python scripts/fetch-processing-steps-suite.py --check

      # The PDF/A conformance corpus (bfocom + veraPDF): fetched, never
      # committed — neither upstream declares a licence, so redistribution
      # terms cannot be satisfied and the files stay on disk. The clause-map
      # gate reads the DERIVED clause index, so the index is rebuilt on every
      # run from whatever the cache restored; the fetch itself is keyed on the
      # fetch script, which is where the commit SHA pins live.
      - name: Cache the PDF/A conformance corpus
        id: pdfa-corpus-cache
        uses: actions/cache@v6
        with:
          path: pdfa-corpus
          key: ${{ runner.os }}-pdfa-corpus-${{ hashFiles('scripts/fetch-pdfa-corpus.py') }}

      - name: Fetch the PDF/A conformance corpus
        if: steps.pdfa-corpus-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch-pdfa-corpus.py

      - name: Build the PDF/A clause index
        run: python scripts/pdfa-clause-index.py

      - name: Verify the PDF/A corpus and its clause index
        run: python scripts/fetch-pdfa-corpus.py --check

      - name: Install Ghostscript as a TEST TOOL (capability-present axis)
        # Ghostscript remains user-installed and absent from the installer.
        # This unpinned test install proves the minimum-version capability path
        # against the current package available to a Windows user.
        # Retries and the pinned upstream fallback live in the script.
        run: powershell -ExecutionPolicy Bypass -File scripts/install-ghostscript-test-tool.ps1
        shell: pwsh

      - name: Export the test Ghostscript path
        run: |
          $candidates = @(Get-ChildItem "${env:ProgramFiles}\gs\gs*\bin\gswin64c.exe" -File -ErrorAction Stop)
          if ($candidates.Count -eq 0) { throw "No installed Ghostscript found" }
          $selected = ($candidates | Sort-Object { [version]($_.Directory.Parent.Name -replace '^gs', '') } -Descending)[0]
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SPECTRAPDF_GS_PATH=$($selected.FullName)" -Encoding utf8
        shell: pwsh

      - name: Engine tests (full suite)
        run: python -m pytest tests/ -q
        env:
          SPECTRAPDF_REQUIRE_ZERO_SKIPS: "1"

  release:
    name: Build & publish (Windows)
    needs: verify
    runs-on: windows-latest
    # Without this the job inherits GitHub's 6-hour default. The vendoring
    # steps download large artifacts from volunteer mirrors, and a mirror that
    # accepts the connection but never sends data would hang rather than fail
    # -- burning hours of Actions time and reporting nothing useful. Successful
    # releases run ~35-40 min, so 90 is generous headroom that still fails
    # visibly. (The LibreOffice step also retries mirrors; this is the backstop
    # for the case retrying cannot fix.)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Node dependencies
        run: npm ci

      - name: Provision embedded Python (vendored)
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-python-embed.ps1
        shell: pwsh

      - name: Vendor the ICC colour profiles (committed under vendor/icc)
        # The profiles are committed to this repository, so this step reads no
        # network and needs no credential. Every file is sha256-verified against
        # scripts/icc-profiles.tsv on the way out and again on disk, and the
        # notice gate refuses to write the tree when a row lacks its notice.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-icc.ps1
        shell: pwsh

      - name: Vendor edit fonts (Liberation family, 12 faces, sha256-pinned)
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-edit-fonts.ps1
        shell: pwsh

      - name: Vendor signature script faces (3 faces, OFL 1.1, sha256-pinned)
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-signature-fonts.ps1
        shell: pwsh

      - name: Cache the pinned LibreOffice msi
        id: libreoffice-msi-cache-build
        uses: actions/cache@v6
        with:
          path: .lo-msi-cache
          key: ${{ runner.os }}-libreoffice-msi-${{ hashFiles('scripts/bundle-libreoffice.ps1') }}

      - name: Vendor LibreOffice (O1 export runtime, MPL-2.0)
        # Self-sufficient: the runner has no LibreOffice, so the script downloads
        # its PINNED, checksum-verified stable .msi (the default in the script).
        # No repo variable, no manual setup. To bump the version, edit
        # $Version/$ExpectedSha256 in the script.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-libreoffice.ps1
        env:
          SPECTRAPDF_LO_MSI_CACHE: .lo-msi-cache

      - name: Vendor native Tesseract
        # Phase 12: recognition is native Tesseract as a subprocess (the GUI, the
        # CLI and every scheduled run share it). Pinned + SHA-256 verified in the
        # script; extracted from the NSIS installer with 7-Zip, never run.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-tesseract.ps1

      - name: Vendor jbig2enc (MRC mask codec, Apache-2.0)
        # O8: the JBIG2 encoder for MRC's 1-bit text stencil. Official prebuilt
        # Windows x64 MSVC release asset, SHA-256 pinned in the script, driven
        # as a subprocess (the Ghostscript pattern). The script REFUSES to ship
        # if any statically-linked component named in upstream's depmf.json
        # lacks a row in scripts/jbig2enc-licenses.tsv.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-jbig2enc.ps1

      - name: Vendor spelling dictionaries
        # P32: 35 Hunspell .aff/.dic pairs from LibreOffice/dictionaries at the
        # commit pinned in the script, each file SHA-256 verified against
        # scripts/dictionaries.tsv. The script REFUSES to write the tree if any
        # tag ships a dictionary with no notice row (the jbig2enc precedent).
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-dictionaries.ps1
        shell: pwsh

      - name: Vendor the Finnish morphological analyser
        # N18: Finnish words are generated, not listed, so the fi tag ships
        # libvoikko plus the voikko-fi transducer instead of an .aff/.dic pair.
        # Two pinned archives, SHA-256 verified before extraction and every
        # extracted file again against scripts/voikko.tsv. Must run AFTER the
        # step above, which rebuilds resources/dictionaries wholesale, and after
        # the Tesseract step, whose mingw runtime DLLs it copies beside
        # libvoikko-1.dll.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-voikko.ps1
        shell: pwsh

      - name: Stage OCR language models
        # Decompresses the 47 pinned Apache-2.0 models into
        # resources/tesseract/tessdata. Must run AFTER the vendoring step, which
        # supplies tessdata/configs (TSV output) and osd.
        run: node scripts/sync-ocr-assets.mjs
        shell: pwsh

      - name: Stage corresponding source archives
        # The HEIF binding ships two LGPL libraries. Every released installer
        # is accompanied by their exact source and the binding's own sdist;
        # the staging script downloads only the version- and SHA-256-pinned
        # rows in scripts/corresponding-source.tsv.
        run: powershell -ExecutionPolicy Bypass -File scripts/stage-corresponding-source.ps1 -OutputDirectory release-sources
        shell: pwsh

      - name: Build, sign, and publish release
        # v1's breaking changes do not touch this workflow: no renamed
        # inputs are used, Tauri 2 is stable, the bundles are Windows-only,
        # and notify-only reads just latest.json's version field. The live
        # proof is the next tag's release run.
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing -- store the private key as a repository secret.
          # The key has no password, so the password is an empty string (no secret needed).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Spectra PDF ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details. The installer is unsigned (no code-signing certificate); SmartScreen may warn on first run -- verify your download against SHA256SUMS.txt, published with this release. Exact corresponding-source archives for the bundled HEIF decoder libraries are attached to this release."
          releaseDraft: false
          prerelease: false

      # The portable distribution: the SAME payload the installer lays down,
      # in a zip instead of an installer. Its tree is read out of the
      # installer's own generated manifest (installer.nsi) rather than from a
      # second list, so a resource added to tauri.conf.json reaches both
      # containers or neither. Must run AFTER the bundle step, which is what
      # writes that manifest. The bundled-binary notice gate applies here
      # exactly as it does to the installer, and refuses with exit 1.
      - name: Build the portable zip
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1
        shell: pwsh

      # The gate the design calls for: the zip's tree, compared entry by entry
      # against the installer's staging manifest. It cannot drift by
      # construction, and this proves the construction on every release rather
      # than assuming it.
      - name: Verify the portable tree against the installer's staging
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1 -Verify src-tauri/target/release/bundle/portable/tree.staging
        shell: pwsh

      # The shipped tree itself, after both containers are assembled: a
      # `resources` directory entry is copied whole, so an engine source tree
      # carrying ignored __pycache__ would put cached bytecode in the installer
      # and the zip alike. Mirrored in scripts/ci-parity-gates.sh.
      - name: Engine payload carries no cached bytecode
        run: python scripts/check-engine-payload.py
        shell: bash

      - name: Publish the portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zips = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -ErrorAction Stop)
          if ($zips.Count -ne 1) { throw "expected one portable zip, found $($zips.Count)" }
          gh release upload ${{ github.ref_name }} $zips[0].FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "failed to upload $($zips[0].Name)" }

      - name: Publish corresponding source archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem release-sources -File -ErrorAction Stop)
          if (-not $files) { throw "no corresponding-source archives were staged" }
          foreach ($file in $files) {
            gh release upload ${{ github.ref_name }} $file.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "failed to upload $($file.Name)" }
          }

      # The installer is UNSIGNED, so a published checksum is the only way a
      # cautious user can confirm the file they downloaded is the file this
      # workflow built. Generated after the release exists, then attached to it.
      - name: Publish SHA-256 checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem $bundle -Filter "*-setup.exe" -ErrorAction Stop)
          if (-not $installers) { throw "no installer found in $bundle to checksum" }
          $sources = @(Get-ChildItem release-sources -File -ErrorAction Stop)
          if (-not $sources) { throw "no corresponding-source archives found to checksum" }
          # The portable zip is unsigned for the same reason the installer is,
          # so it needs its checksum for the same reason -- and it sits in the
          # same file, beside the installer, rather than in one of its own.
          $portable = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -ErrorAction Stop)
          if ($portable.Count -ne 1) { throw "expected one portable zip to checksum, found $($portable.Count)" }
          $files = @($installers) + @($portable) + @($sources)
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            "$h  $($f.Name)"
          }
          $out = Join-Path $bundle "SHA256SUMS.txt"
          # ASCII + LF: this file is consumed by `sha256sum -c` as often as by eye.
          [System.IO.File]::WriteAllText($out, ($lines -join "`n") + "`n", [System.Text.ASCIIEncoding]::new())
          Get-Content $out
          gh release upload ${{ github.ref_name }} $out --clobber
