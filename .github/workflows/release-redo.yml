name: Release (redo)

# REDO PUBLISHER. Used when a tag's release build failed for a reason that is
# not in the product: a pinned third-party vendor host was down and the build
# could never reach the point of producing installers.
#
# THE INVARIANT: the product bytes come from the TAG. This workflow checks the
# tag out in full and each build job overlays exactly ONE file from main: its
# platform's LibreOffice download script (scripts/bundle-libreoffice.ps1 for
# Windows, scripts/bundle-libreoffice.sh for Linux), which downloads vendor
# archives whose SHA-256 values are pinned inside it. Nothing that ends up in a
# package is taken from main; the overlay can only change WHICH HOST is asked
# for bytes that are checksum-verified either way. Do not widen the overlay:
# any other file from main would publish, under the tag's version, code the
# tag does not contain.
#
# VERIFIER TOOLING is the second, separate source: the gates that READ the
# build (the engine payload check, the renderer harness scan, the draft
# verification) run from the workflow's own revision, checked out into
# `verifier/`, never from the tag. Nothing under `verifier/` is a bundle input,
# so a verifier fixed on main can re-check an old tag without touching its
# product bytes -- and an old tag that predates a verifier can still be redone.
# Portable assembly also runs from verifier/: its inputs remain the tag's
# generated manifest, resource staging, and completed installer. In particular
# the app is extracted from that installer, not the unsigned build output
# Tauri restores after bundling. No product bytes come from verifier/.
#
# Two engine-payload regimes, chosen from the TAG's tree:
#   manifest -- the tag carries src/engine/PAYLOAD-MANIFEST.tsv; the built
#               engine tree is compared against that manifest.
#   legacy   -- the tag predates the manifest and bundled src/engine directly;
#               the built engine tree is compared against the tag's tracked
#               src/engine as checked out, minus *.local.* scratch, with cached
#               bytecode refused. No manifest is invented for such a tag.
# tests/test_ci_capability_setup.py runs the selection against the last
# released tags and the legacy verifier against their real trees.
#
# Two platform regimes, also chosen from the TAG's tree: a tag whose
# .github/release-platforms.txt lists linux rebuilds the Linux packages first
# (the `linux`, `linux-appimage`, `linux-smoke` and `linux-appimage-catalog`
# jobs, copies of release.yml's) and the draft verifier holds the draft to the
# Linux assets; any other tag is Windows-only and every Linux job is skipped.
# A redo therefore rebuilds exactly the platform set the tag was released
# with.
#
# Two AppImage regimes for a Linux tag, chosen from the TAG's tree:
#   selfcontained -- the tag carries scripts/appimage-catalog-gate.sh; its
#                    `linux` job builds the .deb and .rpm, `linux-appimage`
#                    builds the AppImage from that .deb on Arch Linux, and the
#                    catalog gate runs against it.
#   legacy        -- the tag's own `linux` job also builds the AppImage;
#                    `linux-appimage` and `linux-appimage-catalog` are
#                    skipped, and Ubuntu runs the AppImage after the .deb
#                    installs WebKitGTK.
#
# The build/sign/publish steps below are copies of release.yml's `linux`,
# `linux-appimage`, `linux-smoke`, `linux-appimage-catalog` and `release`
# jobs. They are kept in step with them by hand; a change to those jobs that
# matters to a republish belongs here too.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish (e.g. v2026.1004.151)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Non-secret signing coordinates, kept in step with release.yml.
  SPECTRAPDF_SIGN_ENDPOINT: https://eus.codesigning.azure.net
  SPECTRAPDF_SIGN_ACCOUNT: signalridgelabs
  SPECTRAPDF_SIGN_PROFILE: SRL-Public
  SPECTRAPDF_SIGN_SUBJECT_CN: Jason Ulbright

jobs:
  regime:
    name: Select the platform regime from the tag's tree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      linux: ${{ steps.platforms.outputs.linux }}
      appimage: ${{ steps.appimage.outputs.regime }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check out the verifier tooling from the workflow's revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: verifier
          sparse-checkout: |
            scripts

      # A YYYY.MDD.N tag or a 1.x.y tag of the history.
      - name: Tag input is a release version
        run: python3 verifier/scripts/release_version.py release-tag "$TAG"
        env:
          TAG: ${{ inputs.tag }}

      - name: Release platforms from the tag's tree
        id: platforms
        run: python3 verifier/scripts/release_platforms.py --rev HEAD --github-output

      - name: Select the AppImage regime from the tag's tree
        id: appimage
        run: |
          if git cat-file -e HEAD:scripts/appimage-catalog-gate.sh 2>/dev/null; then
            regime=selfcontained
          else
            regime=legacy
          fi
          echo "regime=$regime" >> "$GITHUB_OUTPUT"
          echo "AppImage regime for $TAG: $regime"
        env:
          TAG: ${{ inputs.tag }}

  linux:
    name: Rebuild from tag (Linux)
    needs: regime
    if: needs.regime.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Install the build packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential pkg-config file xz-utils zstd dpkg-dev python3 rpm tzdata libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check out the tag in full
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      # The Linux job's one permitted deviation from the tag (see the header).
      - name: Overlay the vendor download tooling from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/bundle-libreoffice.sh
          git --no-pager diff --stat HEAD -- scripts/bundle-libreoffice.sh

      - name: Check out the verifier tooling from the workflow's revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: verifier
          sparse-checkout: |
            scripts
            src-tauri/tests

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: verifier/.node-version
          check-latest: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: Linux-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache the pinned Linux downloads
        uses: actions/cache@v6
        with:
          path: resources/linux-x86_64/.downloads
          key: Linux-downloads-${{ hashFiles('scripts/*.sh', 'scripts/*.tsv', '.python-version', 'scripts/python-requirements-linux.txt') }}

      - name: Install Node dependencies
        run: npm ci

      - name: Build, sign and smoke the Linux packages
        run: sh scripts/linux-release-build.sh --release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          TAURI_SIGNING_RPM_KEY: ${{ secrets.TAURI_SIGNING_RPM_KEY }}
          TAURI_SIGNING_RPM_KEY_PASSPHRASE: ""

      - name: Install the .deb on Ubuntu 22.04
        run: sh verifier/scripts/linux-install-smoke.sh src-tauri/target/release/bundle/linux --deb

      # A legacy tag's build also writes the AppImage, its .zsync and its
      # .sig; a self-contained tag's build writes the .deb and .rpm only.
      - name: Keep the Linux packages for the Windows job
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/linux/spectrapdf_*_amd64.AppImage
            src-tauri/target/release/bundle/linux/spectrapdf_*_amd64.AppImage.zsync
            src-tauri/target/release/bundle/linux/spectrapdf_*_amd64.AppImage.sig
            src-tauri/target/release/bundle/linux/spectrapdf_*_amd64.deb
            src-tauri/target/release/bundle/linux/spectrapdf-*-1.x86_64.rpm
          if-no-files-found: error
          retention-days: 1

  # The self-contained AppImage, built from the .deb above on Arch Linux: the
  # image carries WebKitGTK, GTK 3, the tray library, Ghostscript, the time
  # zone database and the C library from the Arch packages current that day,
  # within the allowlist scripts/appimage-packages.tsv. The build refuses an
  # image that fails the contents gate (scripts/verify-appimage-contents.sh)
  # or the image's CLI check, and --release refuses without the updater key.
  linux-appimage:
    name: Rebuild from tag (Linux AppImage)
    needs: [regime, linux]
    if: needs.regime.outputs.linux == 'true' && needs.regime.outputs.appimage == 'selfcontained'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      # The pinned tools the AppImage build fetches. Every file is re-verified
      # by SHA-256 and size on use, so a cache hit changes no input.
      - name: Cache the pinned AppImage tools
        uses: actions/cache@v6
        with:
          path: resources/linux-x86_64/.downloads
          key: Linux-appimage-downloads-${{ hashFiles('scripts/build-appimage.sh') }}

      # No version pins: the image deploys the Arch packages current that day.
      - name: Install the Arch build packages
        run: sh scripts/build-appimage.sh --install-packages

      - name: Download the Linux packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: linux-packages

      - name: Build, check, smoke and sign the AppImage
        run: sh scripts/build-appimage.sh --deb linux-packages/spectrapdf_*_amd64.deb --out linux-appimage --release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # The .sig is the linux-x86_64 signature in latest.json, never an asset.
      - name: Keep the AppImage for the Windows job
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            linux-appimage/spectrapdf_*_amd64.AppImage
            linux-appimage/spectrapdf_*_amd64.AppImage.zsync
            linux-appimage/spectrapdf_*_amd64.AppImage.sig
          if-no-files-found: error
          retention-days: 1

  # Verifier tooling only: the install checks and the signature check run from
  # the workflow's revision against the packages the tag built.
  linux-smoke:
    name: Install check (Linux)
    needs: [regime, linux, linux-appimage]
    if: >-
      !cancelled() && needs.regime.outputs.linux == 'true' && needs.linux.result == 'success' &&
      (needs.regime.outputs.appimage != 'selfcontained' || needs.linux-appimage.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /keys/spectrapdf-rpm-signing.pub.asc
            /scripts/linux-install-smoke.sh
            /scripts/verify-rpm-signature.sh
            /tests/fixtures/sample.pdf

      - name: Download the Linux packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: linux-packages

      - name: Download the AppImage
        if: needs.regime.outputs.appimage == 'selfcontained'
        uses: actions/download-artifact@v8
        with:
          name: linux-appimage
          path: linux-packages

      - name: Fedora 44 installs the .rpm and runs the AppImage
        run: docker run --rm -v "$PWD:/w" -w /w fedora:44 sh scripts/linux-install-smoke.sh linux-packages --rpm --appimage

      - name: Ubuntu 26.04 runs the AppImage without WebKitGTK and GTK 3, then installs the .deb
        if: needs.regime.outputs.appimage == 'selfcontained'
        run: docker run --rm -v "$PWD:/w" -w /w ubuntu:26.04 sh scripts/linux-install-smoke.sh linux-packages --bare-cli --deb --appimage

      - name: Ubuntu 26.04 installs the .deb, then runs the legacy AppImage
        if: needs.regime.outputs.appimage != 'selfcontained'
        run: docker run --rm -v "$PWD:/w" -w /w ubuntu:26.04 sh scripts/linux-install-smoke.sh linux-packages --deb --appimage

  # The AppImage catalog's own checks, on a base Ubuntu 22.04 system without
  # WebKitGTK or GTK 3: the catalog's AppDir lint, its C library rating
  # (X-AppImage-Self-Contained=true), a window under firejail on Xvfb, and the
  # catalog's screenshot check. Every catalog file is pinned by SHA-256 in the
  # script. The gate mounts the image with FUSE and installs a setuid
  # firejail, so it runs on the runner itself, as root.
  linux-appimage-catalog:
    name: Catalog check (Linux AppImage)
    needs: [regime, linux-appimage]
    if: needs.regime.outputs.linux == 'true' && needs.regime.outputs.appimage == 'selfcontained'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/appimage-catalog-gate.sh
            /scripts/posix-common.sh

      - name: Download the AppImage
        uses: actions/download-artifact@v8
        with:
          name: linux-appimage
          path: linux-appimage

      - name: The AppImage catalog's checks pass without WebKitGTK and GTK 3
        run: |
          chmod 0755 linux-appimage/spectrapdf_*_amd64.AppImage
          sudo sh scripts/appimage-catalog-gate.sh linux-appimage/spectrapdf_*_amd64.AppImage --work "$RUNNER_TEMP/appimage-catalog-gate"

  release:
    name: Rebuild & publish from tag (Windows)
    needs: [regime, linux, linux-appimage, linux-smoke, linux-appimage-catalog]
    if: >-
      !cancelled() && needs.regime.result == 'success' &&
      (needs.regime.outputs.linux != 'true' || (needs.linux-smoke.result == 'success' &&
      (needs.regime.outputs.appimage != 'selfcontained' ||
      (needs.linux-appimage.result == 'success' && needs.linux-appimage-catalog.result == 'success'))))
    runs-on: windows-latest
    # Gates the OIDC federated credential: the app registration trusts this
    # repository only through this environment.
    environment: release
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 150
    steps:
      - name: Check out the tag in full
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      # The one permitted deviation from the tag. Fetch main and take only the
      # vendor download script, so a dead pinned host can be routed around
      # without moving or re-cutting the tag.
      - name: Overlay the vendor download tooling from main
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/bundle-libreoffice.ps1
          git --no-pager diff --stat HEAD -- scripts/bundle-libreoffice.ps1

      # Verifier-only tooling, from the revision this workflow runs at. Read
      # by the gates below; never a bundle input (see the header). The Rust
      # test sources ride along for the draft verifier, which stages ITS copy
      # of the updater manifest check into the TAG's package under a name
      # reserved to the verifier and runs that target, every time: the tag's
      # dependency graph parses the manifest, the tag's own tests never do.
      - name: Check out the verifier tooling from the workflow's revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: verifier
          sparse-checkout: |
            scripts
            src-tauri/tests

      # The one selection made from the tag's tree. It picks a verification
      # REGIME (which expectation the built engine is held to), and both
      # regimes run the verifier's own code from `verifier/`. Nothing in this
      # workflow selects verifier CODE by what the tag carries.
      - name: Select the engine payload verification regime from the tag's tree
        id: engine-regime
        shell: bash
        run: |
          if git cat-file -e HEAD:src/engine/PAYLOAD-MANIFEST.tsv 2>/dev/null; then
            regime=manifest
          else
            regime=legacy
          fi
          echo "regime=$regime" >> "$GITHUB_OUTPUT"
          echo "engine payload regime for ${{ inputs.tag }}: $regime"

      # The second selection made from the tag's tree, and for the same reason:
      # signing is configured in tauri.conf.json, which lives in the tag. A tag
      # cut before signing existed cannot produce signed binaries, and holding
      # its rebuild to a signature gate would make it unredoable. A tag that
      # carries signCommand is held to the full gate.
      - name: Select the signing regime from the tag's tree
        id: signing-regime
        shell: bash
        run: |
          if git grep -q "signCommand" HEAD -- src-tauri/tauri.conf.json 2>/dev/null; then
            signed=true
          else
            signed=false
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "signing regime for ${{ inputs.tag }}: signed=$signed"

      # Authenticode signing runs inside the bundler (see release.yml). Every
      # signing step is skipped for a tag that predates signing: the bundler
      # never invokes a sign command it has no configuration for.
      - name: Install the Artifact Signing client tools
        if: steps.signing-regime.outputs.signed == 'true'
        # This switch already exists in the tag's script: no product overlay.
        # A stalled download must not consume the entire release job.
        timeout-minutes: 5
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/install-signing-tools.ps1 -SkipWinget

      # A toolchain, not product bytes: the Node major is the one pin the
      # workflow's revision carries. verifier/ is a sparse cone checkout, and a
      # cone checkout always carries the repository's root files.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: verifier/.node-version
          check-latest: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Windows on ARM runs the x64 app, but its Explorer loads only an
          # ARM64 File Explorer command handler.
          targets: aarch64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Node dependencies
        run: npm ci

      - name: Provision embedded Python (vendored)
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-python-embed.ps1
        shell: pwsh

      - name: Vendor the ICC colour profiles (committed under vendor/icc)
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-icc.ps1
        shell: pwsh

      - name: Vendor edit fonts (Liberation family, 12 faces, sha256-pinned)
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-edit-fonts.ps1
        shell: pwsh

      - name: Vendor signature script faces (3 faces, OFL 1.1, sha256-pinned)
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-signature-fonts.ps1
        shell: pwsh

      - name: Cache the pinned LibreOffice msi
        id: libreoffice-msi-cache-build
        uses: actions/cache@v6
        with:
          path: .lo-msi-cache
          key: ${{ runner.os }}-libreoffice-msi-${{ hashFiles('scripts/bundle-libreoffice.ps1') }}

      - name: Vendor LibreOffice (Office export runtime, MPL-2.0)
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-libreoffice.ps1
        env:
          SPECTRAPDF_LO_MSI_CACHE: .lo-msi-cache

      - name: Vendor native Tesseract
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-tesseract.ps1

      - name: Vendor jbig2enc (MRC mask codec, Apache-2.0)
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-jbig2enc.ps1

      # A tag cut before the bundle script existed ships no Ghostscript, and a
      # redo rebuilds what the tag shipped.
      - name: Vendor Ghostscript (unmodified upstream, SHA-256 pinned)
        if: hashFiles('scripts/bundle-ghostscript.ps1') != ''
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-ghostscript.ps1

      - name: Vendor spelling dictionaries
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-dictionaries.ps1
        shell: pwsh

      - name: Vendor the Finnish morphological analyser
        # Must run AFTER the dictionaries step, which rebuilds
        # resources/dictionaries wholesale, and after the Tesseract step, whose
        # mingw runtime DLLs it copies beside libvoikko-1.dll.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-voikko.ps1
        shell: pwsh

      - name: Stage OCR language models
        # Must run AFTER the Tesseract vendoring step, which supplies
        # tessdata/configs (TSV output) and osd.
        run: node scripts/sync-ocr-assets.mjs
        shell: pwsh

      # The tag's own handler build, for a tag that carries one (see
      # release.yml). The tag's `beforeBundleCommand` signs, packs and stages
      # it inside the build step.
      - name: Stage the File Explorer command handler
        if: hashFiles('scripts/build-shell-menu.ps1') != ''
        run: powershell -ExecutionPolicy Bypass -File scripts/build-shell-menu.ps1 -CompileOnly
        shell: pwsh

      # The release body and the updater manifest's `notes` are one string,
      # taken from the changelog section for this version. The extractor
      # refuses a missing or empty section, a `Remaining` heading, and the
      # terms that never appear in release notes; it writes LF only, because
      # the draft verifier compares the manifest's `notes` to the release
      # body byte for byte. The local CI-parity battery runs the same
      # extraction for the version the four surfaces carry.
      - name: Release notes from the changelog
        id: notes
        shell: bash
        run: |
          version="${TAG#v}"
          body="$(python verifier/scripts/release-notes-from-changelog.py "$version" --changelog CHANGELOG.md)"
          {
            echo "body<<SPECTRA_NOTES_EOF"
            echo "$body"
            echo "SPECTRA_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      - name: Azure login (federated, no secret)
        if: steps.signing-regime.outputs.signed == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The federated assertion azure/login redeems expires MINUTES after the
      # job's id-token is minted, and the access token cached here is valid for
      # at most 60 minutes. The signing dlib asks the CLI for a token in the
      # signing-service scope, which the login itself does not cache, so every
      # signature the build produces must happen inside that 60-minute window
      # measured from this step. Nothing slow may sit between these two steps
      # and the build below; provisioning belongs above the login.
      - name: Cache a signing-service token
        if: steps.signing-regime.outputs.signed == 'true'
        shell: pwsh
        run: |
          $raw = az account get-access-token --scope https://codesigning.azure.net/.default --output json
          if ($LASTEXITCODE -ne 0) { throw "az account get-access-token failed (exit $LASTEXITCODE)" }
          $token = $raw | ConvertFrom-Json
          Write-Host "signing-service token cached, expires_on: $($token.expires_on)"

      # DRAFT FIRST, same order as release.yml: assets land on a draft, every
      # gate runs against the uploaded assets, the last step undrafts. A
      # release for this tag that is already public is refused by the
      # verification step, so a redo can never overwrite published assets.
      - name: Build, sign, and upload to a draft release
        id: draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          SPECTRAPDF_SIGN: ${{ steps.signing-regime.outputs.signed == 'true' && '1' || '0' }}
          SPECTRAPDF_SIGN_ENDPOINT: ${{ env.SPECTRAPDF_SIGN_ENDPOINT }}
          SPECTRAPDF_SIGN_ACCOUNT: ${{ env.SPECTRAPDF_SIGN_ACCOUNT }}
          SPECTRAPDF_SIGN_PROFILE: ${{ env.SPECTRAPDF_SIGN_PROFILE }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: ${{ inputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Build the portable zip
        run: |
          $signing = @{}
          if ('${{ steps.signing-regime.outputs.signed }}' -ceq 'true') { $signing.ExpectSigned = $true }
          & ./verifier/scripts/build-portable-zip.ps1 -ProjectRoot . @signing
          if ($LASTEXITCODE -ne 0) { throw "portable build failed (exit $LASTEXITCODE)" }
        shell: pwsh

      - name: Verify the portable tree against the installer's staging
        run: |
          $signing = @{}
          if ('${{ steps.signing-regime.outputs.signed }}' -ceq 'true') { $signing.ExpectSigned = $true }
          & ./verifier/scripts/build-portable-zip.ps1 -ProjectRoot . @signing -Verify src-tauri/target/release/bundle/portable/tree.staging
          if ($LASTEXITCODE -ne 0) { throw "portable verification failed (exit $LASTEXITCODE)" }
        shell: pwsh

      - name: Portable payload notice map covers every declared resource
        run: powershell -ExecutionPolicy Bypass -File verifier/scripts/build-portable-zip.ps1 -ProjectRoot . -CheckMap
        shell: pwsh

      # The publish gate for signing, from the verifier's own revision.
      - name: Verify the Authenticode signatures on the built artifacts
        if: steps.signing-regime.outputs.signed == 'true'
        shell: pwsh
        run: |
          . ./verifier/scripts/windows-signing.ps1
          $installer = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installer.Count -ne 1) { throw "expected one installer to verify, found $($installer.Count)" }
          Assert-AuthenticodeSigned -Path $installer[0].FullName -ExpectedSubjectCommonName $env:SPECTRAPDF_SIGN_SUBJECT_CN
          $zips = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -File)
          if ($zips.Count -ne 1) { throw "expected one portable zip to verify, found $($zips.Count)" }
          $extracted = Join-Path ([System.IO.Path]::GetTempPath()) "portable-signature-check"
          if (Test-Path -LiteralPath $extracted) { Remove-Item -LiteralPath $extracted -Recurse -Force }
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath $extracted
          $exes = @(Get-ChildItem -LiteralPath $extracted -Recurse -Filter "spectrapdf.exe" -File)
          if ($exes.Count -ne 1) { throw "expected one spectrapdf.exe in the portable zip, found $($exes.Count)" }
          Assert-AuthenticodeSigned -Path $exes[0].FullName -ExpectedSubjectCommonName $env:SPECTRAPDF_SIGN_SUBJECT_CN

      - name: Engine payload manifest is current
        if: steps.engine-regime.outputs.regime == 'manifest'
        run: python verifier/scripts/gen-engine-payload-manifest.py --root . --check
        shell: bash

      - name: Engine payload matches its manifest
        if: steps.engine-regime.outputs.regime == 'manifest'
        run: python verifier/scripts/check-engine-payload.py --root .
        shell: bash

      - name: Engine payload matches the tag's engine tree (legacy, pre-manifest tag)
        if: steps.engine-regime.outputs.regime == 'legacy'
        run: python verifier/scripts/check-engine-payload.py --root . --legacy-rev HEAD
        shell: bash

      - name: Shipped renderer carries no test harness
        run: python verifier/scripts/check-release-bundle.py "$GITHUB_WORKSPACE/dist/renderer"
        shell: bash

      - name: Upload the portable zip to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $zips = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -ErrorAction Stop)
          if ($zips.Count -ne 1) { throw "expected one portable zip, found $($zips.Count)" }
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($file in $zips) {
            foreach ($stale in @($assets | Where-Object name -ceq $file.Name)) {
              gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
              if ($LASTEXITCODE -ne 0) { throw "failed to replace $($file.Name)" }
            }
            $name = [uri]::EscapeDataString($file.Name)
            gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$name" --input $file.FullName > $null
            if ($LASTEXITCODE -ne 0) { throw "failed to upload $($file.Name)" }
          }

      - name: Download the Linux packages
        if: needs.regime.outputs.linux == 'true'
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: src-tauri/target/release/bundle/linux

      - name: Download the Linux AppImage
        if: needs.regime.outputs.linux == 'true' && needs.regime.outputs.appimage == 'selfcontained'
        uses: actions/download-artifact@v8
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/linux

      - name: Upload the Linux packages to the draft
        if: needs.regime.outputs.linux == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          . ./verifier/scripts/linux-release-assets.ps1
          $files = Get-LinuxReleaseAssets -Directory "src-tauri/target/release/bundle/linux" -Version ("${{ inputs.tag }}" -creplace '^v','')
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($file in $files.Uploaded) {
            foreach ($stale in @($assets | Where-Object name -ceq $file.Name)) {
              gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
              if ($LASTEXITCODE -ne 0) { throw "failed to replace $($file.Name)" }
            }
            $name = [uri]::EscapeDataString($file.Name)
            gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$name" --input $file.FullName > $null
            if ($LASTEXITCODE -ne 0) { throw "failed to upload $($file.Name)" }
          }

      - name: Upload latest.json with the Linux updater entry
        if: needs.regime.outputs.linux == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: pwsh -NoProfile -File verifier/scripts/add-linux-updater-entry.ps1 -Repo "${{ github.repository }}" -ReleaseId $env:RELEASE_ID -Tag "${{ inputs.tag }}" -LinuxDir src-tauri/target/release/bundle/linux

      - name: Upload SHA-256 checksums to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
          LINUX_DIR: ${{ needs.regime.outputs.linux == 'true' && 'src-tauri/target/release/bundle/linux' || '' }}
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem $bundle -Filter "*-setup.exe" -ErrorAction Stop)
          if (-not $installers) { throw "no installer found in $bundle to checksum" }
          $portable = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -ErrorAction Stop)
          if ($portable.Count -ne 1) { throw "expected one portable zip to checksum, found $($portable.Count)" }
          $files = @($installers) + @($portable)
          if ($env:LINUX_DIR) {
            . ./verifier/scripts/linux-release-assets.ps1
            $files += @((Get-LinuxReleaseAssets -Directory $env:LINUX_DIR -Version ("${{ inputs.tag }}" -creplace '^v','')).Checksummed)
          }
          # The name column is the name GitHub serves the asset under, not the
          # build directory's: this file is verified with `sha256sum -c` beside
          # downloaded files, and GitHub rewrites a space in an uploaded asset
          # name. One rule, shared with the draft verifier.
          . ./verifier/scripts/github-asset-name.ps1
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            "$h  $(Get-GitHubAssetName $f.Name)"
          }
          $out = Join-Path $bundle "SHA256SUMS.txt"
          # ASCII + LF: this file is consumed by `sha256sum -c` as often as by eye.
          [System.IO.File]::WriteAllText($out, ($lines -join "`n") + "`n", [System.Text.ASCIIEncoding]::new())
          Get-Content $out
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($stale in @($assets | Where-Object name -ceq "SHA256SUMS.txt")) {
            gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
            if ($LASTEXITCODE -ne 0) { throw "failed to replace SHA256SUMS.txt" }
          }
          gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=SHA256SUMS.txt" --input $out > $null
          if ($LASTEXITCODE -ne 0) { throw "failed to upload SHA256SUMS.txt" }

      # Every draft asset is downloaded by id and hashed; the uploaded bytes
      # must equal the built bytes, the uploaded SHA256SUMS.txt, and the
      # uploaded signature (script header for the full contract).
      - name: Verify the draft's assets and updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: pwsh -NoProfile -File verifier/scripts/verify-release-draft.ps1 -Repo "${{ github.repository }}" -ReleaseId $env:RELEASE_ID -Tag "${{ inputs.tag }}" ${{ steps.signing-regime.outputs.signed == 'true' && '-ExpectSigned' || '' }} ${{ needs.regime.outputs.linux == 'true' && '-LinuxDir src-tauri/target/release/bundle/linux' || '' }}

      # The ONLY step that makes anything public. Must stay last.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $repo = "${{ github.repository }}"
          $release = gh api --method PATCH "repos/$repo/releases/$env:RELEASE_ID" -F draft=false -F prerelease=false | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft) { throw "release $env:RELEASE_ID did not publish" }
          Write-Host "published $($release.html_url)"
