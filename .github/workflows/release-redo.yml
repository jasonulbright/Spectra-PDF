name: Release (redo)

# REDO PUBLISHER. Used when a tag's release build failed for a reason that is
# not in the product: a pinned third-party vendor host was down and the build
# could never reach the point of producing installers.
#
# THE INVARIANT: the product bytes come from the TAG. This workflow checks the
# tag out in full and overlays exactly ONE file from main --
# scripts/bundle-libreoffice.ps1 -- which downloads a vendor archive whose
# SHA-256 is pinned inside it. Nothing that ends up in an installer is taken
# from main; the overlay can only change WHICH HOST is asked for bytes that are
# checksum-verified either way. Do not widen the overlay: any other file from
# main would publish, under the tag's version, code the tag does not contain.
#
# The build/sign/publish steps below are a copy of release.yml's `release` job.
# They are kept in step with it by hand; a change to that job that matters to a
# republish belongs here too.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish (e.g. v1.1.15)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Rebuild & publish from tag (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out the tag in full
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      # The one permitted deviation from the tag. Fetch main and take only the
      # vendor download script, so a dead pinned host can be routed around
      # without moving or re-cutting the tag.
      - name: Overlay the vendor download tooling from main
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/bundle-libreoffice.ps1
          git --no-pager diff --stat HEAD -- scripts/bundle-libreoffice.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Node dependencies
        run: npm ci

      - name: Provision embedded Python (vendored)
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-python-embed.ps1
        shell: pwsh

      - name: Vendor the ICC colour profiles (committed under vendor/icc)
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-icc.ps1
        shell: pwsh

      - name: Vendor edit fonts (Liberation family, 12 faces, sha256-pinned)
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-edit-fonts.ps1
        shell: pwsh

      - name: Vendor signature script faces (3 faces, OFL 1.1, sha256-pinned)
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-signature-fonts.ps1
        shell: pwsh

      - name: Cache the pinned LibreOffice msi
        id: libreoffice-msi-cache-build
        uses: actions/cache@v6
        with:
          path: .lo-msi-cache
          key: ${{ runner.os }}-libreoffice-msi-${{ hashFiles('scripts/bundle-libreoffice.ps1') }}

      - name: Vendor LibreOffice (O1 export runtime, MPL-2.0)
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-libreoffice.ps1
        env:
          SPECTRAPDF_LO_MSI_CACHE: .lo-msi-cache

      - name: Vendor native Tesseract
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-tesseract.ps1

      - name: Vendor jbig2enc (MRC mask codec, Apache-2.0)
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-jbig2enc.ps1

      - name: Vendor spelling dictionaries
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-dictionaries.ps1
        shell: pwsh

      - name: Vendor the Finnish morphological analyser
        # Must run AFTER the dictionaries step, which rebuilds
        # resources/dictionaries wholesale, and after the Tesseract step, whose
        # mingw runtime DLLs it copies beside libvoikko-1.dll.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-voikko.ps1
        shell: pwsh

      - name: Stage OCR language models
        # Must run AFTER the Tesseract vendoring step, which supplies
        # tessdata/configs (TSV output) and osd.
        run: node scripts/sync-ocr-assets.mjs
        shell: pwsh

      - name: Stage corresponding source archives
        run: powershell -ExecutionPolicy Bypass -File scripts/stage-corresponding-source.ps1 -OutputDirectory release-sources
        shell: pwsh

      # DRAFT FIRST, same order as release.yml: assets land on a draft, every
      # gate runs against the uploaded assets, the last step undrafts. A
      # release for this tag that is already public is refused by the
      # verification step, so a redo can never overwrite published assets.
      - name: Build, sign, and upload to a draft release
        id: draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Spectra PDF ${{ inputs.tag }}"
          releaseBody: "See CHANGELOG.md for details. The installer is unsigned (no code-signing certificate); SmartScreen may warn on first run -- verify your download against SHA256SUMS.txt, published with this release. Exact corresponding-source archives for the bundled HEIF decoder libraries are attached to this release."
          releaseDraft: true
          prerelease: false

      - name: Build the portable zip
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1
        shell: pwsh

      - name: Verify the portable tree against the installer's staging
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1 -Verify src-tauri/target/release/bundle/portable/tree.staging
        shell: pwsh

      - name: Portable payload notice map covers every declared resource
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1 -CheckMap
        shell: pwsh

      - name: Engine payload manifest is current
        run: python scripts/gen-engine-payload-manifest.py --check
        shell: bash

      - name: Engine payload matches its manifest
        run: python scripts/check-engine-payload.py
        shell: bash

      - name: Shipped renderer carries no test harness
        run: python scripts/check-release-bundle.py
        shell: bash

      - name: Upload the portable zip to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $zips = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -ErrorAction Stop)
          if ($zips.Count -ne 1) { throw "expected one portable zip, found $($zips.Count)" }
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($file in $zips) {
            foreach ($stale in @($assets | Where-Object name -eq $file.Name)) {
              gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
              if ($LASTEXITCODE -ne 0) { throw "failed to replace $($file.Name)" }
            }
            $name = [uri]::EscapeDataString($file.Name)
            gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$name" --input $file.FullName > $null
            if ($LASTEXITCODE -ne 0) { throw "failed to upload $($file.Name)" }
          }

      - name: Upload corresponding source archives to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $files = @(Get-ChildItem release-sources -File -ErrorAction Stop)
          if (-not $files) { throw "no corresponding-source archives were staged" }
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($file in $files) {
            foreach ($stale in @($assets | Where-Object name -eq $file.Name)) {
              gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
              if ($LASTEXITCODE -ne 0) { throw "failed to replace $($file.Name)" }
            }
            $name = [uri]::EscapeDataString($file.Name)
            gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$name" --input $file.FullName > $null
            if ($LASTEXITCODE -ne 0) { throw "failed to upload $($file.Name)" }
          }

      - name: Upload SHA-256 checksums to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem $bundle -Filter "*-setup.exe" -ErrorAction Stop)
          if (-not $installers) { throw "no installer found in $bundle to checksum" }
          $sources = @(Get-ChildItem release-sources -File -ErrorAction Stop)
          if (-not $sources) { throw "no corresponding-source archives found to checksum" }
          $portable = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -ErrorAction Stop)
          if ($portable.Count -ne 1) { throw "expected one portable zip to checksum, found $($portable.Count)" }
          $files = @($installers) + @($portable) + @($sources)
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            "$h  $($f.Name)"
          }
          $out = Join-Path $bundle "SHA256SUMS.txt"
          # ASCII + LF: this file is consumed by `sha256sum -c` as often as by eye.
          [System.IO.File]::WriteAllText($out, ($lines -join "`n") + "`n", [System.Text.ASCIIEncoding]::new())
          Get-Content $out
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($stale in @($assets | Where-Object name -eq "SHA256SUMS.txt")) {
            gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
            if ($LASTEXITCODE -ne 0) { throw "failed to replace SHA256SUMS.txt" }
          }
          gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=SHA256SUMS.txt" --input $out > $null
          if ($LASTEXITCODE -ne 0) { throw "failed to upload SHA256SUMS.txt" }

      - name: Verify the draft's assets and updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ inputs.tag }}"
          $version = $tag -replace '^v',''
          $release = gh api "repos/$repo/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if (-not $release.draft) { throw "release $env:RELEASE_ID is already public before verification" }
          if ($release.tag_name -ne $tag) { throw "draft is for tag '$($release.tag_name)', expected '$tag'" }
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installer = @(Get-ChildItem $bundle -Filter "*-setup.exe" -ErrorAction Stop)
          if ($installer.Count -ne 1) { throw "expected one installer, found $($installer.Count)" }
          $signature = Get-Item (Join-Path $bundle "$($installer[0].Name).sig") -ErrorAction Stop
          $portable = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -ErrorAction Stop)
          $sources = @(Get-ChildItem release-sources -File -ErrorAction Stop)
          $sums = Get-Item (Join-Path $bundle "SHA256SUMS.txt") -ErrorAction Stop
          $local = @($installer) + @($signature) + @($portable) + @($sources) + @($sums)
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          $expected = @($local.Name) + @("latest.json") | Sort-Object
          $actual = @($assets.name) | Sort-Object
          if (($expected -join "`n") -ne ($actual -join "`n")) {
            throw "draft assets differ from the built set.`nexpected:`n$($expected -join "`n")`nactual:`n$($actual -join "`n")"
          }
          foreach ($file in $local) {
            $asset = $assets | Where-Object name -eq $file.Name
            if ($asset.size -ne $file.Length) { throw "$($file.Name): uploaded $($asset.size) bytes, built $($file.Length)" }
          }
          foreach ($line in Get-Content $sums.FullName) {
            $hash, $name = $line -split '  ', 2
            $file = $local | Where-Object Name -eq $name
            if (-not $file) { throw "SHA256SUMS.txt names '$name', which is not an uploaded asset" }
            $actualHash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            if ($actualHash -ne $hash) { throw "SHA256SUMS.txt is stale for $name" }
          }
          $manifestAsset = $assets | Where-Object name -eq "latest.json"
          $manifestPath = Join-Path $bundle "latest.draft.json"
          gh api -H "Accept: application/octet-stream" "repos/$repo/releases/assets/$($manifestAsset.id)" > $manifestPath
          if ($LASTEXITCODE -ne 0) { throw "failed to download latest.json from the draft" }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw "latest.json version '$($manifest.version)' != tag version '$version'" }
          $platform = $manifest.platforms.'windows-x86_64'
          if (-not $platform) { throw "latest.json has no windows-x86_64 platform" }
          $expectedSig = (Get-Content $signature.FullName -Raw).Trim()
          if ($platform.signature.Trim() -ne $expectedSig) { throw "latest.json signature is not the installer's .sig" }
          $installerAsset = $assets | Where-Object name -eq $installer[0].Name
          if (-not $platform.url.EndsWith("/releases/assets/$($installerAsset.id)")) {
            throw "latest.json url '$($platform.url)' does not name the uploaded installer asset $($installerAsset.id)"
          }
          Write-Host "draft $env:RELEASE_ID verified: $($actual.Count) assets, latest.json at $version"

      # The ONLY step that makes anything public. Must stay last.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $repo = "${{ github.repository }}"
          $release = gh api --method PATCH "repos/$repo/releases/$env:RELEASE_ID" -F draft=false -F prerelease=false | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft) { throw "release $env:RELEASE_ID did not publish" }
          Write-Host "published $($release.html_url)"
