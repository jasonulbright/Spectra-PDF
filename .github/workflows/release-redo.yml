name: Release (redo)

# REDO PUBLISHER. Used when a tag's release build failed for a reason that is
# not in the product: a pinned third-party vendor host was down and the build
# could never reach the point of producing installers.
#
# THE INVARIANT: the product bytes come from the TAG. This workflow checks the
# tag out in full and overlays exactly ONE file from main --
# scripts/bundle-libreoffice.ps1 -- which downloads a vendor archive whose
# SHA-256 is pinned inside it. Nothing that ends up in an installer is taken
# from main; the overlay can only change WHICH HOST is asked for bytes that are
# checksum-verified either way. Do not widen the overlay: any other file from
# main would publish, under the tag's version, code the tag does not contain.
#
# VERIFIER TOOLING is the second, separate source: the gates that READ the
# build (the engine payload check, the renderer harness scan, the draft
# verification) run from the workflow's own revision, checked out into
# `verifier/`, never from the tag. Nothing under `verifier/` is a bundle input,
# so a verifier fixed on main can re-check an old tag without touching its
# product bytes -- and an old tag that predates a verifier can still be redone.
#
# Two engine-payload regimes, chosen from the TAG's tree:
#   manifest -- the tag carries src/engine/PAYLOAD-MANIFEST.tsv; the built
#               engine tree is compared against that manifest.
#   legacy   -- the tag predates the manifest and bundled src/engine directly;
#               the built engine tree is compared against the tag's tracked
#               src/engine as checked out, minus *.local.* scratch, with cached
#               bytecode refused. No manifest is invented for such a tag.
# tests/test_ci_capability_setup.py runs the selection against the last
# released tags and the legacy verifier against their real trees.
#
# The build/sign/publish steps below are a copy of release.yml's `release` job.
# They are kept in step with it by hand; a change to that job that matters to a
# republish belongs here too.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish (e.g. v1.1.15)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Non-secret signing coordinates, kept in step with release.yml.
  SPECTRAPDF_SIGN_ENDPOINT: https://eus.codesigning.azure.net
  SPECTRAPDF_SIGN_ACCOUNT: signalridgelabs
  SPECTRAPDF_SIGN_PROFILE: SRL-Public
  SPECTRAPDF_SIGN_SUBJECT_CN: Jason Ulbright

jobs:
  release:
    name: Rebuild & publish from tag (Windows)
    runs-on: windows-latest
    # Gates the OIDC federated credential: the app registration trusts this
    # repository only through this environment.
    environment: release
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 150
    steps:
      - name: Check out the tag in full
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      # The one permitted deviation from the tag. Fetch main and take only the
      # vendor download script, so a dead pinned host can be routed around
      # without moving or re-cutting the tag.
      - name: Overlay the vendor download tooling from main
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/bundle-libreoffice.ps1
          git --no-pager diff --stat HEAD -- scripts/bundle-libreoffice.ps1

      # Verifier-only tooling, from the revision this workflow runs at. Read
      # by the gates below; never a bundle input (see the header). The Rust
      # test sources ride along for the draft verifier, which stages ITS copy
      # of the updater manifest check into the TAG's package under a name
      # reserved to the verifier and runs that target, every time: the tag's
      # dependency graph parses the manifest, the tag's own tests never do.
      - name: Check out the verifier tooling from the workflow's revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: verifier
          sparse-checkout: |
            scripts
            src-tauri/tests

      # The one selection made from the tag's tree. It picks a verification
      # REGIME (which expectation the built engine is held to), and both
      # regimes run the verifier's own code from `verifier/`. Nothing in this
      # workflow selects verifier CODE by what the tag carries.
      - name: Select the engine payload verification regime from the tag's tree
        id: engine-regime
        shell: bash
        run: |
          if git cat-file -e HEAD:src/engine/PAYLOAD-MANIFEST.tsv 2>/dev/null; then
            regime=manifest
          else
            regime=legacy
          fi
          echo "regime=$regime" >> "$GITHUB_OUTPUT"
          echo "engine payload regime for ${{ inputs.tag }}: $regime"

      # The second selection made from the tag's tree, and for the same reason:
      # signing is configured in tauri.conf.json, which lives in the tag. A tag
      # cut before signing existed cannot produce signed binaries, and holding
      # its rebuild to a signature gate would make it unredoable. A tag that
      # carries signCommand is held to the full gate.
      - name: Select the signing regime from the tag's tree
        id: signing-regime
        shell: bash
        run: |
          if git grep -q "signCommand" HEAD -- src-tauri/tauri.conf.json 2>/dev/null; then
            signed=true
          else
            signed=false
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "signing regime for ${{ inputs.tag }}: signed=$signed"

      # Authenticode signing runs inside the bundler (see release.yml). Both
      # steps are no-ops for a tag that predates signing: the bundler never
      # invokes a sign command it has no configuration for.
      - name: Install the Artifact Signing client tools
        if: steps.signing-regime.outputs.signed == 'true'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/install-signing-tools.ps1

      - name: Azure login (federated, no secret)
        if: steps.signing-regime.outputs.signed == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Node dependencies
        run: npm ci

      - name: Provision embedded Python (vendored)
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-python-embed.ps1
        shell: pwsh

      - name: Vendor the ICC colour profiles (committed under vendor/icc)
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-icc.ps1
        shell: pwsh

      - name: Vendor edit fonts (Liberation family, 12 faces, sha256-pinned)
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-edit-fonts.ps1
        shell: pwsh

      - name: Vendor signature script faces (3 faces, OFL 1.1, sha256-pinned)
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-signature-fonts.ps1
        shell: pwsh

      - name: Cache the pinned LibreOffice msi
        id: libreoffice-msi-cache-build
        uses: actions/cache@v6
        with:
          path: .lo-msi-cache
          key: ${{ runner.os }}-libreoffice-msi-${{ hashFiles('scripts/bundle-libreoffice.ps1') }}

      - name: Vendor LibreOffice (O1 export runtime, MPL-2.0)
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-libreoffice.ps1
        env:
          SPECTRAPDF_LO_MSI_CACHE: .lo-msi-cache

      - name: Vendor native Tesseract
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-tesseract.ps1

      - name: Vendor jbig2enc (MRC mask codec, Apache-2.0)
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-jbig2enc.ps1

      - name: Vendor spelling dictionaries
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-dictionaries.ps1
        shell: pwsh

      - name: Vendor the Finnish morphological analyser
        # Must run AFTER the dictionaries step, which rebuilds
        # resources/dictionaries wholesale, and after the Tesseract step, whose
        # mingw runtime DLLs it copies beside libvoikko-1.dll.
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-voikko.ps1
        shell: pwsh

      - name: Stage OCR language models
        # Must run AFTER the Tesseract vendoring step, which supplies
        # tessdata/configs (TSV output) and osd.
        run: node scripts/sync-ocr-assets.mjs
        shell: pwsh

      - name: Stage corresponding source archives
        run: powershell -ExecutionPolicy Bypass -File scripts/stage-corresponding-source.ps1 -OutputDirectory release-sources
        shell: pwsh

      # The release body and the updater manifest's `notes` are one string,
      # taken from the changelog section for this version. The extractor
      # refuses a missing or empty section, a `Remaining` heading, and the
      # terms that never appear in release notes; it writes LF only, because
      # the draft verifier compares the manifest's `notes` to the release
      # body byte for byte. The local CI-parity battery runs the same
      # extraction for the version the four surfaces carry.
      - name: Release notes from the changelog
        id: notes
        shell: bash
        run: |
          version="${TAG#v}"
          body="$(python verifier/scripts/release-notes-from-changelog.py "$version" --changelog CHANGELOG.md)"
          {
            echo "body<<SPECTRA_NOTES_EOF"
            echo "$body"
            echo "SPECTRA_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      # DRAFT FIRST, same order as release.yml: assets land on a draft, every
      # gate runs against the uploaded assets, the last step undrafts. A
      # release for this tag that is already public is refused by the
      # verification step, so a redo can never overwrite published assets.
      - name: Build, sign, and upload to a draft release
        id: draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          SPECTRAPDF_SIGN: ${{ steps.signing-regime.outputs.signed == 'true' && '1' || '0' }}
          SPECTRAPDF_SIGN_ENDPOINT: ${{ env.SPECTRAPDF_SIGN_ENDPOINT }}
          SPECTRAPDF_SIGN_ACCOUNT: ${{ env.SPECTRAPDF_SIGN_ACCOUNT }}
          SPECTRAPDF_SIGN_PROFILE: ${{ env.SPECTRAPDF_SIGN_PROFILE }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: ${{ inputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Build the portable zip
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1
        shell: pwsh

      - name: Verify the portable tree against the installer's staging
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1 -Verify src-tauri/target/release/bundle/portable/tree.staging
        shell: pwsh

      - name: Portable payload notice map covers every declared resource
        run: powershell -ExecutionPolicy Bypass -File scripts/build-portable-zip.ps1 -CheckMap
        shell: pwsh

      # The publish gate for signing, from the verifier's own revision.
      - name: Verify the Authenticode signatures on the built artifacts
        if: steps.signing-regime.outputs.signed == 'true'
        shell: pwsh
        run: |
          . ./verifier/scripts/windows-signing.ps1
          $installer = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installer.Count -ne 1) { throw "expected one installer to verify, found $($installer.Count)" }
          Assert-AuthenticodeSigned -Path $installer[0].FullName -ExpectedSubjectCommonName $env:SPECTRAPDF_SIGN_SUBJECT_CN
          $zips = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -File)
          if ($zips.Count -ne 1) { throw "expected one portable zip to verify, found $($zips.Count)" }
          $extracted = Join-Path ([System.IO.Path]::GetTempPath()) "portable-signature-check"
          if (Test-Path -LiteralPath $extracted) { Remove-Item -LiteralPath $extracted -Recurse -Force }
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath $extracted
          $exes = @(Get-ChildItem -LiteralPath $extracted -Recurse -Filter "spectrapdf.exe" -File)
          if ($exes.Count -ne 1) { throw "expected one spectrapdf.exe in the portable zip, found $($exes.Count)" }
          Assert-AuthenticodeSigned -Path $exes[0].FullName -ExpectedSubjectCommonName $env:SPECTRAPDF_SIGN_SUBJECT_CN

      - name: Engine payload manifest is current
        if: steps.engine-regime.outputs.regime == 'manifest'
        run: python verifier/scripts/gen-engine-payload-manifest.py --root . --check
        shell: bash

      - name: Engine payload matches its manifest
        if: steps.engine-regime.outputs.regime == 'manifest'
        run: python verifier/scripts/check-engine-payload.py --root .
        shell: bash

      - name: Engine payload matches the tag's engine tree (legacy, pre-manifest tag)
        if: steps.engine-regime.outputs.regime == 'legacy'
        run: python verifier/scripts/check-engine-payload.py --root . --legacy-rev HEAD
        shell: bash

      - name: Shipped renderer carries no test harness
        run: python verifier/scripts/check-release-bundle.py "$GITHUB_WORKSPACE/dist/renderer"
        shell: bash

      - name: Upload the portable zip to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $zips = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -ErrorAction Stop)
          if ($zips.Count -ne 1) { throw "expected one portable zip, found $($zips.Count)" }
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($file in $zips) {
            foreach ($stale in @($assets | Where-Object name -ceq $file.Name)) {
              gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
              if ($LASTEXITCODE -ne 0) { throw "failed to replace $($file.Name)" }
            }
            $name = [uri]::EscapeDataString($file.Name)
            gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$name" --input $file.FullName > $null
            if ($LASTEXITCODE -ne 0) { throw "failed to upload $($file.Name)" }
          }

      - name: Upload corresponding source archives to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $files = @(Get-ChildItem release-sources -File -ErrorAction Stop)
          if (-not $files) { throw "no corresponding-source archives were staged" }
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($file in $files) {
            foreach ($stale in @($assets | Where-Object name -ceq $file.Name)) {
              gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
              if ($LASTEXITCODE -ne 0) { throw "failed to replace $($file.Name)" }
            }
            $name = [uri]::EscapeDataString($file.Name)
            gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$name" --input $file.FullName > $null
            if ($LASTEXITCODE -ne 0) { throw "failed to upload $($file.Name)" }
          }

      - name: Upload SHA-256 checksums to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem $bundle -Filter "*-setup.exe" -ErrorAction Stop)
          if (-not $installers) { throw "no installer found in $bundle to checksum" }
          $sources = @(Get-ChildItem release-sources -File -ErrorAction Stop)
          if (-not $sources) { throw "no corresponding-source archives found to checksum" }
          $portable = @(Get-ChildItem "src-tauri/target/release/bundle/portable" -Filter "*-portable.zip" -ErrorAction Stop)
          if ($portable.Count -ne 1) { throw "expected one portable zip to checksum, found $($portable.Count)" }
          $files = @($installers) + @($portable) + @($sources)
          # The name column is the name GitHub serves the asset under, not the
          # build directory's: this file is verified with `sha256sum -c` beside
          # downloaded files, and GitHub rewrites a space in an uploaded asset
          # name. One rule, shared with the draft verifier.
          . ./verifier/scripts/github-asset-name.ps1
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            "$h  $(Get-GitHubAssetName $f.Name)"
          }
          $out = Join-Path $bundle "SHA256SUMS.txt"
          # ASCII + LF: this file is consumed by `sha256sum -c` as often as by eye.
          [System.IO.File]::WriteAllText($out, ($lines -join "`n") + "`n", [System.Text.ASCIIEncoding]::new())
          Get-Content $out
          $repo = "${{ github.repository }}"
          $assets = @(gh api "repos/$repo/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          foreach ($stale in @($assets | Where-Object name -ceq "SHA256SUMS.txt")) {
            gh api --method DELETE "repos/$repo/releases/assets/$($stale.id)"
            if ($LASTEXITCODE -ne 0) { throw "failed to replace SHA256SUMS.txt" }
          }
          gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=SHA256SUMS.txt" --input $out > $null
          if ($LASTEXITCODE -ne 0) { throw "failed to upload SHA256SUMS.txt" }

      # Every draft asset is downloaded by id and hashed; the uploaded bytes
      # must equal the built bytes, the uploaded SHA256SUMS.txt, and the
      # uploaded signature (script header for the full contract).
      - name: Verify the draft's assets and updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: pwsh -NoProfile -File verifier/scripts/verify-release-draft.ps1 -Repo "${{ github.repository }}" -ReleaseId $env:RELEASE_ID -Tag "${{ inputs.tag }}" ${{ steps.signing-regime.outputs.signed == 'true' && '-ExpectSigned' || '' }}

      # The ONLY step that makes anything public. Must stay last.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
        run: |
          $repo = "${{ github.repository }}"
          $release = gh api --method PATCH "repos/$repo/releases/$env:RELEASE_ID" -F draft=false -F prerelease=false | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft) { throw "release $env:RELEASE_ID did not publish" }
          Write-Host "published $($release.html_url)"
