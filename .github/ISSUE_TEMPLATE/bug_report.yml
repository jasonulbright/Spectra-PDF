name: Bug report
description: Something behaves incorrectly, crashes, or produces a wrong file
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **If this is a security issue** -- a crafted file that crashes the app,
        redaction that leaves content behind, a signature verified as good when
        it isn't -- please **don't** file it here. Use
        [private vulnerability reporting](https://github.com/jasonulbright/Spectra-PDF/security/advisories/new)
        instead, so a fix can ship before the details are public.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose the ... tool
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Help -> About, or the installer filename.
      placeholder: "2.8.4"
    validations:
      required: true

  - type: dropdown
    id: how
    attributes:
      label: Where did it happen?
      options:
        - In the app
        - On the command line
        - Both
    validations:
      required: true

  - type: textarea
    id: file
    attributes:
      label: The document
      description: |
        If a specific PDF triggers it, attaching it (or a small one that shows
        the same thing) is by far the most useful thing you can include.
        Only attach files you're comfortable sharing publicly -- this issue is
        visible to everyone.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Error messages, screenshots, whether it happens every time.
