# cargo-about config: generates THIRD-PARTY-LICENSES-RUST.html (shipped as a
# bundle resource) from the exact Cargo.lock crate graph. Regenerate with
# scripts/gen-rust-licenses.ps1. The accepted list is every license family
# actually present in the dependency tree -- all permissive or file-level
# copyleft (MPL-2.0, unmodified upstream crates); anything outside this list
# (e.g. GPL) fails the generation loudly so it gets reviewed, not shipped
# silently.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "0BSD",
]
