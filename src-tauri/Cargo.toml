[package]
name = "spectrapdf"
version = "1.1.20"
description = "Modern PDF manipulation studio"
authors = ["Jason Ulbright"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "spectrapdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Already in the lock as a transitive dependency; the build script verifies
# every staged engine file against the manifest's recorded digest.
sha2 = "0.10"

[features]
# Optional in-app W3C WebDriver server, so e2e needs no
# msedgedriver, no tauri-driver, and no WebView2 remote-debugging port -- which
# is the only way past the v150 elevated-host hardening that keeps CI's e2e job
# disabled (see .github/workflows/ci.yml and DECISIONS).
#
# A FEATURE, not `cfg(debug_assertions)`: this is excluded from a release build
# at COMPILE time, so the automation server cannot ship even by accident. The
# upstream README is explicit -- "Never include it in production builds."
webdriver = ["tauri-plugin-webdriver"]

# The end-to-end network carve-out: lets `SPECTRA_NET_ALLOW_PRIVATE` /
# `SPECTRAPDF_E2E` allow a loopback destination so the e2e network spec can
# talk to its own 127.0.0.1 server.
#
# A FEATURE, not an environment check compiled into every binary: without it
# `net::env_allows_private` is a `false` constant, so a release artifact
# contains no code path that reads either variable and cannot be talked out of
# the private-address policy. The e2e harness builds with it (see
# e2e-tests/wdio.conf.ts and the CI e2e job); nothing else does.
e2e-net-private = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-webdriver = { version = "0.2", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
window-vibrancy = "0.8"
windows-version = "0.1"
windows = { version = "0.62", features = ["UI_ViewManagement", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_TaskScheduler", "Win32_Devices_ImageAcquisition", "Win32_UI_Shell", "Win32_Security_Cryptography", "Win32_System_Time", "Win32_System_SystemInformation"] }
# Named directly, at the version `windows` itself uses: `#[implement]` expands
# to `windows_core::` paths, and without a direct dependency that name resolves
# to the older windows-core another crate in the graph pulls in, so the
# generated COM vtable fails to typecheck against the interface it implements.
windows-core = "0.62"
# WebView2's own COM bindings, already in the tree because tauri-runtime-wry
# uses them -- promoted to a direct dependency so the web capture can reach
# ICoreWebView2_7::PrintToPdf, which is Chromium's own print pipeline.
webview2-com = "0.38"
# Those bindings are generated against windows-core 0.61, and an interface
# cast only typechecks against the `Interface` trait from the SAME
# windows-core the interface was generated with -- so 0.61 is named alongside
# the 0.62 the rest of the crate uses. Neither version is a browser-runtime
# pin: they track the crates, not the installed WebView2.
windows-core-webview2 = { package = "windows-core", version = "0.61" }
tokio = { version = "1", features = ["sync", "io-util"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# Windows-safe fs::canonicalize (strips the \\?\ verbatim prefix): file
# identity is the raw path STRING app-wide, so every path must enter the
# renderer in ONE canonical spelling (the path-identity gate).
dunce = "1"
# TRUE file identity (volume serial + file index), for the batch-mirror
# same-file refusals: canonical STRINGS can disagree about one physical file
# (UNC vs mapped drive letter, hardlinks — Windows' VOLUME_NAME_DOS behavior
# is version-inconsistent for network mounts), and a string-only guard there
# risks overwriting a user's originals. Hand-rolled GetFileInformationByHandle
# rejected: more unsafe code to get wrong than this zero-frills crate.
same-file = "1"
clap = { version = "4", features = ["derive"] }
# The app's one outbound HTTP client (`src/net.rs`). Already in the graph
# because the updater plugin uses it; named directly so there is exactly one
# client and one place the network posture is set. The `cookies` feature is
# deliberately NOT enabled: with no jar in the build there is no ambient
# credential for a request to pick up.
#
# Default features are off and TLS is the only one asked for: HTTP/2 and the
# charset guessing are not wanted here, and taking the crate's defaults would
# pull dependencies the rest of the graph does not already resolve.
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
# RFC 3986 reference resolution and userinfo detection for the outbound client.
# Already in the graph under reqwest; named directly because net.rs resolves a
# `Location` with `Url::join` rather than by hand.
url = "2"

[dev-dependencies]
# `#[tokio::test]` for the network client's tests, which drive an in-process
# loopback listener. No test reaches a real host.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
